# yubios mkosi build configuration (particleos ethos)
# Produces: signed UKI + dm-verity root + composefs image
# Usage: mkosi --profile desktop build

[Config]
MinimumVersion=26~devel

[Build]
ToolsTree=default
ToolsTreeProfiles=misc,runtime,gui
Incremental=yes
CacheDirectory=mkosi.cache

[Output]
OutputDirectory=mkosi.output
Format=disk
ImageId=yubios
SplitArtifacts=uki,partitions
ManifestFormat=json

[Content]
UnifiedKernelImageFormat=%i_%v_%a

# Kernel args: rw + dissect root (particleos pattern)
# fido2.device=auto: dracut fido2 module uses this to find YubiKey at boot
KernelCommandLine=
        root=dissect
        mount.usr=dissect
        rw
        audit=0

Packages=
        libfido2
        yubikey-manager
        yubico-piv-tool
        opensc
        pam-u2f
        pcsc-lite
        pcsc-lite-ccid
        sbsigntool
        sbctl
        cryptsetup
        fido2-tools
        tpm2-tools
        tpm2-tss
        openssh
        systemd
        systemd-boot
        systemd-networkd
        systemd-resolved
        udev

[Validation]
# SecureBoot=yes: UKIs signed at build time with sbctl/sbsign.
# For YubiKey PIV signing, run yubios-enroll-sb post-install.
SecureBoot=yes
SignExpectedPcr=no

[Runtime]
RuntimeSize=30G
Ephemeral=yes
