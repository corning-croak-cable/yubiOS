# yubiOS mkosi build configuration (particleos ethos)
# Separate partitioned-image lane; bootc composefs uses a different storage
# model (writable ext4/Btrfs plus EROFS metadata and fs-verity objects).
# Usage: mkosi --profile desktop build

[Config]
MinimumVersion=26~devel

[Build]
ToolsTree=default
ToolsTreeProfiles=misc,runtime,gui
Incremental=yes
CacheDirectory=mkosi.cache

[Output]
OutputDirectory=mkosi.output
Format=disk
ImageId=yubiOS
SplitArtifacts=uki,partitions
ManifestFormat=json

[Content]
UnifiedKernelImageFormat=%i_%v_%a

# Kernel args: rw + dissect root (particleos pattern)
# fido2.device=auto: dracut fido2 module uses this to find YubiKey at boot
KernelCommandLine=
        root=dissect
        mount.usr=dissect
        rw
        audit=0

Packages=
        libfido2
        yubikey-manager
        yubico-piv-tool
        opensc
        pam-u2f
        pamu2fcfg
        pcsc-lite
        pcsc-lite-ccid
        sbctl
        osslsigncode
        cryptsetup
        fido2-tools
        tpm2-tools
        tpm2-tss
        openssh
        systemd
        systemd-boot
        systemd-networkd
        systemd-resolved
        udev

[Validation]
# SecureBoot=yes: UKIs signed at build time via systemd-sbsign (ADR-008).
# YubiKey PIV (slot 9c, PKCS#11) signing: run yubiOS-enroll-sb post-install.
SecureBoot=yes
SignExpectedPcr=no

[Runtime]
RuntimeSize=30G
Ephemeral=yes


