# yubiOS systemd-repart partition layout
# This is the separate mkosi/DDI fixed-image path: EROFS data is paired with a
# dm-verity hash partition. It is not the writable ext4/Btrfs physical sysroot
# consumed by `bootc install to-filesystem --composefs-backend`.
[Partition]
Type=root
Label=root
Format=erofs
Minimize=best
ReadOnly=yes
Verity=data
VerityMatchFor=root-verity

[Partition]
Type=root-verity
Label=root-verity
Verity=hash
VerityMatchFor=root
SplitName=verity


