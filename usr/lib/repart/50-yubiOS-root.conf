# yubiOS systemd-repart partition layout
# Used by mkosi disk image builds and by external installers preparing the
# filesystem tree consumed by: bootc install to-filesystem.
# Verity partition pairs the root with a dm-verity hash partition.
# composefs sits on top and provides the verified directory tree.
[Partition]
Type=root
Label=root
Format=erofs
Minimize=best
ReadOnly=yes
Verity=data
VerityMatchFor=root-verity

[Partition]
Type=root-verity
Label=root-verity
Verity=hash
VerityMatchFor=root
SplitName=verity
