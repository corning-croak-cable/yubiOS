# bcvk ephemeral DirectBoot uses a virtiofs root and has no persistent
# bootloader or EFI System Partition for bootupd to update. Real installed
# systems keep Fedora bootloader updates enabled.
#
# bcvk deliberately omits root=, rootfstype=, and rootflags= from the kernel
# command line, so this guard must inspect the live root mount instead of
# matching a kernel argument.
[Service]
ExecCondition=/usr/lib/yubiOS/skip-bootloader-update-if-bcvk.sh

