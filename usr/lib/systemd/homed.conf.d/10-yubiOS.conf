# yubiOS systemd-homed defaults
# Source: https://www.man7.org/linux/man-pages/man5/homed.conf.5.html

[Home]
# LUKS2 loopback file per user — strongest encryption, YubiKey FIDO2 unlockable.
# Source: homectl(1) --storage=luks
DefaultStorage=luks

# btrfs inside LUKS2: quota, snapshots, efficient copy-on-write.
# Source: homectl(1) --fs-type=btrfs
DefaultFileSystemType=btrfs


