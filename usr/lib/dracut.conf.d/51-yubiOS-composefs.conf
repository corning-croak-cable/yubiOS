# yubiOS bootc composefs dracut configuration.
# The upstream 51bootc module installs bootc-root-setup.service and the
# initramfs setup binary. Native bootc composefs uses EROFS metadata plus
# fs-verity-protected objects; dm-verity belongs to the separate mkosi/DDI path.
# Source: https://github.com/bootc-dev/bootc/tree/main/crates/initramfs/dracut
add_drivers+=" overlay erofs "
add_dracutmodules+=" bootc "


