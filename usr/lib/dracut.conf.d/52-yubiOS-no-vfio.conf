# ADR-024 rule 1: default yubiOS images ship virtio-gpu only. Keep VFIO
# drivers out of the initramfs entirely so no boot-time hook can bind them
# before the modprobe.d blacklist in usr/lib/modprobe.d/50-yubiOS-no-vfio.conf
# is even consulted.
# See refs/vgpu-vfio-user-trust-boundary-2026-07-25.md.
omit_drivers+=" vfio vfio_pci vfio_pci_core vfio_iommu_type1 vfio_virqfd "


