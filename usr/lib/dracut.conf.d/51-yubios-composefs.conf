# yubios composefs + dm-verity dracut configuration
# Enables fs-verity-backed immutable root via composefs.
# Source: https://github.com/containers/composefs
# Source: particleos ethos — usr/ mounted read-only, verified at boot
add_drivers+=" overlay erofs "
add_dracutmodules+=" composefs dm-verity "
# composefs mounts the OSTree/bootc deployment via erofs + verity
# rootfs is a composefs image over a verity-checked backing store
