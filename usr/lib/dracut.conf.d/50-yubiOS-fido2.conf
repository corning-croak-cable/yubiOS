# Include FIDO2 module in initramfs for YubiKey disk unlock at boot.
# Required for: systemd-cryptenroll --fido2-device=auto
# Source: https://www.freedesktop.org/software/systemd/man/latest/systemd-cryptenroll.html
#
# The fido2 dracut module ships libfido2 and the hidraw kernel modules into
# the initrd so that /dev/hidraw* is available before the root FS is mounted.
add_dracutmodules+=" fido2 "
install_items+=" /usr/bin/fido2-assert /usr/bin/fido2-token "


