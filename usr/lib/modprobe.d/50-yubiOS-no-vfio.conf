# ADR-024 rule 1: default yubiOS images ship virtio-gpu only. No vfio-pci
# autoload, no vfio.conf, no initramfs binding -- passthrough is an explicit,
# policy-gated deviation, never an image default.
# See refs/vgpu-vfio-user-trust-boundary-2026-07-25.md.
#
# install .../bin/false (not blacklist alone) so modprobe by name still
# refuses even if something requests these modules directly rather than via
# an alias match.
blacklist vfio
blacklist vfio_pci
blacklist vfio_pci_core
blacklist vfio_iommu_type1
blacklist vfio_virqfd
install vfio /bin/false
install vfio_pci /bin/false
install vfio_pci_core /bin/false
install vfio_iommu_type1 /bin/false
install vfio_virqfd /bin/false


