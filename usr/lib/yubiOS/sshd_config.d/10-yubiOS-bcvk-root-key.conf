# bcvk ephemeral VMs inject the CI root SSH public key as the systemd
# tmpfiles.extra system credential. The helper below exposes that key to sshd
# without changing installed-system root SSH policy when the credential is absent.
Match User root
    AuthorizedKeysCommand /usr/lib/yubiOS/sshd-authorized-keys-bcvk.sh %u
    AuthorizedKeysCommandUser root
