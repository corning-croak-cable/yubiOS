# bcvk ephemeral VMs inject the CI root SSH public key as a systemd
# credential. Current CI may use ssh.authorized_keys.root; older bcvk builds
# use tmpfiles.extra. The helper below accepts both forms without changing
# installed-system root SSH policy when neither credential is present.
Match User root
    AuthorizedKeysCommand /usr/lib/yubiOS/sshd-authorized-keys-bcvk.sh %u
    AuthorizedKeysCommandUser root
