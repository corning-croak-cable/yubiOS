# ADR-031 rule 1: default yubiOS images ship virtio-gpu only. No /dev/vfio
# exists on a default guest. The modprobe.d blacklist (50-yubiOS-no-vfio.conf)
# prevents the kernel modules from loading, and the dracut.conf.d omit
# (52-yubiOS-no-vfio.conf) keeps the .ko files out of the initramfs that bcvk
# DirectBoot uses -- but that is not enough. systemd-tmpfiles reads
# /usr/lib/tmpfiles.d/static-nodes-permissions.conf from the systemd package at
# every boot and runs `z /dev/vfio/vfio 0666 - - -`, which CREATES the device
# node from nothing on every boot, regardless of whether the kernel module is
# blacklisted or absent. The cdev file is harmless without the kernel module
# behind it, but its mere existence is the exact attack-surface signal
# tests/vm/test-vgpu-virtio-ci.sh's `test ! -e /dev/vfio` assertion is checking.
#
# Override: tmpfiles processes entries globally in path-sorted order across
# all config files. Our /dev/vfio/vfio entry sorts before /dev/vfio, so it
# fires first and removes the cdev file; then /dev/vfio fires on the now-empty
# directory and removes that. Both `r` actions are idempotent and safe to run
# every boot. Numeric prefix 53 sorts the file after the upstream
# static-nodes-permissions.conf (which has no prefix) and after the 50/51/52
# yubiOS drop-ins, so the yubiOS override wins regardless of upstream ordering.
#
# See refs/vgpu-vfio-user-trust-boundary-2026-07-25.md.
r /dev/vfio/vfio
r /dev/vfio
