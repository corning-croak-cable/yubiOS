# OMN-96 -- yubiOS fTPM /dev/tpm0 guest verification (always-on Stage B)
#
# Small dedicated workflow that runs ONLY the fTPM legs of ci_test-vm.yml,
# forcing Stage B (Linux payload + in-guest verify-tpm0-pcr-extend.sh) on so
# every run proves /dev/tpm0 is exposed and PCR extend works in a yubiOS
# guest booted under the OP-TEE fTPM firmware.
#
# Pattern is copied verbatim from ci_test-vm.yml (commit 36727ee / 5e1f3a9 /
# 97dbb79 in ses_06730e703ffezdFn0SrMQJhw8R):
#   - Bare ubuntu-24.04 runner (no container; podman/bcvk need privileges
#     the hardened dhi.io/debian-base container strips).
#   - `sudo apt-get install` for host deps (the runner user can't lock
#     /var/lib/apt/lists/).
#   - `sudo env "PATH=$PATH:/usr/sbin:/sbin" ...` wrapping every podman
#     invocation so rootful podman can see what was pulled and bcvk can
#     find the binary.
#
# Reuses the existing tests/vm/* canon instead of reimplementing it:
#   - tests/vm/test-ftpm-qemu-ci.sh: pulls firmware bundle + yubiOS image,
#     boots Stage A (firmware markers), and Stage B (bcvk to-disk + in-guest
#     verifier) when FTPM_LINUX_PAYLOAD=1.
#   - tests/vm/verify-tpm0-pcr-extend.sh: in-guest done-condition check
#     (fTPM TA present, /dev/tpm0 + /dev/tpmrm0 exist, tpm2_startup,
#     tpm2_pcrread, tpm2_pcrextend changes the value).
#   - tests/vm/ftpm-console-driver.py: QEMU serial-console driver that
#     uploads verify-tpm0-pcr-extend.sh in 384-byte chunks and reads back
#     the in-guest exit code.
#
# Honest contract: rc=0 pass, rc=77 loud SKIP (firmware or test image
# unavailable, or bcvk to-disk hung within TO_DISK_TIMEOUT), anything else
# FAIL.
name: yubiOS fTPM /dev/tpm0 guest verify (OMN-96)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ci_test-ftpm-tpm0.yml'
      - 'tests/vm/test-ftpm-qemu-ci.sh'
      - 'tests/vm/ftpm-console-driver.py'
      - 'tests/vm/verify-tpm0-pcr-extend.sh'
  workflow_dispatch:
    inputs:
      firmware_image:
        description: 'OCI ref for the firmware bundle. Default: published QEMU ARM64 firmware (qemu-arm64 tag from ci_firmware-rk.yml Stage 4).'
        required: false
        default: 'docker.io/0mniteck/yubios:firmware-qemu-arm64'
        type: string
      yubios_image:
        description: 'OCI ref for the yubiOS dev/test image to install and boot under the fTPM firmware.'
        required: false
        default: 'docker.io/0mniteck/yubios:dev'
        type: string

permissions:
  contents: read

jobs:
  ftpm-tpm0-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Reclaim workspace before checkout (bare runner -- root-owned leftovers possible)
        run: |
          sudo rm -rf "$GITHUB_WORKSPACE"
          mkdir -p "$GITHUB_WORKSPACE"

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # PINNED.md

      - name: Install host deps (podman, qemu aarch64, swtpm, tpm2-tools)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            podman qemu-system-arm qemu-efi-aarch64 qemu-utils swtpm swtpm-tools tpm2-tools \
            python3 python3-serial skopeo

      - name: Login to docker.io (bare runner pulls need creds for 0mniteck42 namespace)
        env:
          DOCKER_USER: 0mniteck42
          DOCKER_PASS: ${{ secrets.DOCKER }}
        run: |
          echo "$DOCKER_PASS" | sudo podman login --username "$DOCKER_USER" --password-stdin docker.io

      - name: Run tests/vm/test-ftpm-qemu-ci.sh with FTPM_LINUX_PAYLOAD=1 (Stage A + Stage B, always)
        env:
          # IMPORTANT: path matches ci_test-vm.yml + the canonical 97dbb79 commit
          # (sudo env "PATH=$PATH:/usr/sbin:/sbin" -- bcvk binary is in /usr/sbin).
          PATH: ${{ runner.temp }}/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          FIRMWARE_IMAGE: ${{ inputs.firmware_image || 'docker.io/0mniteck/yubios:firmware-qemu-arm64' }}
          YUBIOS_IMAGE: ${{ inputs.yubios_image || 'docker.io/0mniteck/yubios:dev' }}
          FTPM_LINUX_PAYLOAD: '1'    # force Stage B (Linux payload + in-guest verifier)
          BOOT_TIMEOUT: '180'
          LINUX_BOOT_TIMEOUT: '900'
          TO_DISK_TIMEOUT: '900'
          WORK: /tmp/yubios-ftpm-tpm0-work
          LOG_DIR: /tmp/yubios-ftpm-tpm0-logs
        run: |
          set -euo pipefail
          chmod +x tests/vm/test-ftpm-qemu-ci.sh tests/vm/ftpm-console-driver.py tests/vm/verify-tpm0-pcr-extend.sh
          # sudo env "PATH=$PATH:/usr/sbin:/sbin" is the yubiOS canon (ci_test-vm.yml +
          # ses_06730e703ffezdFn0SrMQJhw8R b5169ad + 97dbb79): rootful podman pulls
          # see the same store bcvk reads from, and the PATH includes /usr/sbin
          # where bcvk and blockdev live.
          sudo env "PATH=$PATH:/usr/sbin:/sbin" bash tests/vm/test-ftpm-qemu-ci.sh
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "--- secure-world serial log tail ---"
            sudo tail -200 /tmp/yubios-ftpm-tpm0-logs/ftpm-optee.log 2>/dev/null || true
            echo "--- normal-world serial log tail ---"
            sudo tail -200 /tmp/yubios-ftpm-tpm0-logs/ftpm-nw.log 2>/dev/null || true
            echo "--- bcvk to-disk log tail (Stage B) ---"
            sudo tail -200 /tmp/yubios-ftpm-tpm0-logs/ftpm-to-disk.log 2>/dev/null || true
            echo "--- guest console log tail (Stage B) ---"
            sudo tail -200 /tmp/yubios-ftpm-tpm0-logs/ftpm-linux.log 2>/dev/null || true
          fi
          if [ "$rc" -eq 77 ]; then
            echo "::warning::SKIP: fTPM /dev/tpm0 leg incomplete (see log)"
            echo "### ftpm-tpm0 -- SKIP" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          [ "$rc" -eq 0 ] || exit "$rc"
          echo "### ftpm-tpm0 -- PASS: /dev/tpm0 + tpm2_* verified in yubiOS guest" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload fTPM serial logs
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # PINNED.md
        with:
          name: ftpm-tpm0-logs
          path: /tmp/yubios-ftpm-tpm0-logs/*.log
          if-no-files-found: warn
          retention-days: 7
