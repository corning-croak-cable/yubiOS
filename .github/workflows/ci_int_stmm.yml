name: ci_int_stmm

# yubiOS INT lane I-A (#35 ARM64 fTPM stack): build the EDK2 StandaloneMM RPMB
# platform FV -> BL32_AP_MM.fd, the secure-variable-storage image OP-TEE later
# folds in via CFG_STMM_PATH. First stage of the integration build order
# (edk2 StMM -> optee_os devkit -> optee_ftpm -> optee_os final -> TF-A FIP ->
# u-boot). Produces a NAMED artifact (BL32_AP_MM.fd) the orchestrator
# (ci_test-int.yml, F3) consumes.
#
# GROUNDING (truth-or-silence; knowledge/arm64-ftpm-build-graph.md +
# GET_TO_WORK/research/F1-edk2-standalonemm.md):
# - BL32_AP_MM.fd does NOT come from the edk2 fork alone. The platform DSC
#   `Platform/StandaloneMm/PlatformStandaloneMmPkg/PlatformStandaloneMmRpmb.dsc`
#   lives in edk2-platforms (now a live yubi-OS fork). PACKAGES_PATH spans BOTH
#   edk2 (BaseTools + core packages) and edk2-platforms (the platform DSC).
# - Toolchain: use the EDK2 **GCCNOLTO** tag (FAMILY=GCC, so the platform DSC's
#   `GCC:` [BuildOptions] still apply). GCCNOLTO is the upstream no-LTO toolchain:
#   it carries none of the `-flto` / GccLto `-plugin-opt=-pass-through=-llto-aarch64`
#   link flags that the plain `GCC` tag injects. That avoids two distinct failures
#   seen iterating this lane: (1) the EDK2 RELEASE LTO miscompile of mbedTLS
#   constant_time.c, and (2) `ld: bad -plugin-opt option` from dangling GccLto
#   flags once LTO is disabled by hand. (Cross-checked tools_def.template:
#   GCC_AARCH64_CC_FLAGS == GCCNOLTO_AARCH64_CC_FLAGS; only the DLINK flags differ.)
# - mbedTLS aarch64 inline asm: constant_time.c emits `ldr %w0, [%1]` (and the CT
#   primitive barriers) gated solely on `MBEDTLS_HAVE_ASM && __aarch64__` — there is
#   NO `MBEDTLS_CT_NO_ASM` knob in this mbedTLS rev. The cross aarch64 gcc rejects
#   that asm at -c time ("invalid 'asm': invalid operand"), independent of LTO. We
#   disable the master `MBEDTLS_HAVE_ASM` switch in EDK2's mbedtls_config.h so
#   mbedTLS falls back to portable constant-time C (correct for a build-proof FV;
#   production trust anchor stays the YubiKey, fTPM is platform integrity).
# - StMM runs as an OP-TEE secure partition (CFG_STMM_PATH), NOT via TF-A SPM_MM
#   (SPD=opteed and SPM_MM are mutually exclusive). This job only PRODUCES the FV;
#   the OP-TEE fold is the next INT lane (F2 / ci_int_optee_fip.yml).
#
# BARE runner (no dhi container): EDK2 BaseTools (C) + the AARCH64 cross toolchain
# need a full host libc/crt*.o that the hardened dhi base intentionally omits.
# Action refs pinned per PINNED.md.

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ci_int_stmm.yml
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/ci_int_stmm.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  EDK2_REPO: https://github.com/yubi-OS/edk2.git
  EDK2_PLATFORMS_REPO: https://github.com/yubi-OS/edk2-platforms.git
  ACTIVE_PLATFORM: Platform/StandaloneMm/PlatformStandaloneMmPkg/PlatformStandaloneMmRpmb.dsc

jobs:
  build-bl32-ap-mm:
    name: BL32_AP_MM.fd (StandaloneMM RPMB, AARCH64) ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    concurrency:
      group: ${{ github.workflow }}-stmm-${{ matrix.arch }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Install EDK2 build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential uuid-dev iasl nasm \
            python3 python3-venv python3-pip \
            bison flex libssl-dev \
            gcc-aarch64-linux-gnu git

      - name: Clone edk2 + edk2-platforms (yubi-OS forks)
        run: |
          set -eux
          ws="$GITHUB_WORKSPACE/uefi"
          mkdir -p "$ws"
          git clone --filter=tree:0 "$EDK2_REPO" "$ws/edk2"
          git clone --filter=tree:0 "$EDK2_PLATFORMS_REPO" "$ws/edk2-platforms"
          ( cd "$ws/edk2" && git submodule update --init --recursive )
          echo "edk2 HEAD:           $(cd "$ws/edk2" && git rev-parse HEAD)"
          echo "edk2-platforms HEAD: $(cd "$ws/edk2-platforms" && git rev-parse HEAD)"
          # Prove the platform DSC + FDF are present before building.
          test -f "$ws/edk2-platforms/$ACTIVE_PLATFORM"
          test -f "$ws/edk2-platforms/${ACTIVE_PLATFORM%.dsc}.fdf"

      - name: Resolve AARCH64 cross prefix
        id: tc
        run: |
          # amd64 runner cross-compiles; native arm64 runner has aarch64 host gcc.
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            echo "prefix=" >> "$GITHUB_OUTPUT"
          else
            echo "prefix=aarch64-linux-gnu-" >> "$GITHUB_OUTPUT"
          fi

      - name: Build BaseTools
        run: make -C "$GITHUB_WORKSPACE/uefi/edk2/BaseTools" -j"$(nproc)"

      - name: Build StandaloneMM RPMB platform (BL32_AP_MM.fd)
        id: build
        run: |
          set -ex
          ws="$GITHUB_WORKSPACE/uefi"
          export WORKSPACE="$ws"
          export PACKAGES_PATH="$ws/edk2:$ws/edk2-platforms"
          export PYTHON_COMMAND=python3
          cd "$ws/edk2"
          . ./edksetup.sh
          # --- Root-cause fix 1: mbedTLS aarch64 inline asm ---------------------
          # constant_time.c:58 `ldr %w0, [%1]` (+ the CT barrier primitives) compile
          # ONLY when MBEDTLS_HAVE_ASM is defined; the cross aarch64 gcc rejects that
          # asm as 'invalid operand'. There is no MBEDTLS_CT_NO_ASM knob in this rev,
          # so flip the master switch off -> portable constant-time C fallback.
          cfg=CryptoPkg/Library/MbedTlsLib/Include/mbedtls/mbedtls_config.h
          sed -i 's@^#define MBEDTLS_HAVE_ASM@/* yubiOS CI: aarch64 inline-asm rejected by cross gcc */ \/\/ #define MBEDTLS_HAVE_ASM@' "$cfg"
          # aes.c calls mbedtls_aesce_* (ARM AES crypto-extension) under MBEDTLS_AESCE_C,
          # but aesce.c's bodies need NEON/crypto intrinsics that -mgeneral-regs-only
          # (StandaloneMM) forbids, so they compile out -> undefined refs at link. Disable
          # the AESCE accel path too; portable C AES is correct for this build-proof FV.
          sed -i 's@^#define MBEDTLS_AESCE_C@/* yubiOS CI: ARM AES-CE needs intrinsics forbidden under -mgeneral-regs-only */ \/\/ #define MBEDTLS_AESCE_C@' "$cfg"
          grep -nE 'MBEDTLS_HAVE_ASM|MBEDTLS_AESCE_C' "$cfg" | head
          # --- Root-cause fix 2: LTO -------------------------------------------
          # Use the GCCNOLTO tag (FAMILY=GCC) instead of GCC: no -flto and none of
          # the GccLto -plugin-opt link flags, so neither the LTO miscompile nor the
          # `ld: bad -plugin-opt option` link error can occur. Belt-and-suspenders:
          # drop any -Werror so stray GCC-14 warnings don't fail a build-proof CI.
          sed -i 's/ -Werror//g' Conf/tools_def.txt
          TAG=GCCNOLTO
          export GCCNOLTO_AARCH64_PREFIX="${{ steps.tc.outputs.prefix }}"
          echo "Using toolchain tag: $TAG (prefix='${GCCNOLTO_AARCH64_PREFIX}')"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          build -a AARCH64 -t "$TAG" -b RELEASE \
            -p "$ACTIVE_PLATFORM" \
            -n "$(nproc)"

      - name: Locate + stage BL32_AP_MM.fd
        id: stage
        run: |
          set -ex
          ws="$GITHUB_WORKSPACE/uefi"
          fd="$(find "$ws/edk2/Build" -name 'BL32_AP_MM.fd' | head -n1)"
          test -n "$fd"
          ls -l "$fd"
          file "$fd"
          out="$GITHUB_WORKSPACE/artifacts"
          mkdir -p "$out"
          cp "$fd" "$out/BL32_AP_MM.fd"
          sha256sum "$out/BL32_AP_MM.fd"

      - name: Upload BL32_AP_MM.fd
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # PINNED.md
        with:
          name: BL32_AP_MM-${{ matrix.arch }}
          path: artifacts/BL32_AP_MM.fd
          if-no-files-found: error
