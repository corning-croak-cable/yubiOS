name: fetch-dhi-manifest
on:
  workflow_dispatch:
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Login to dhi.io
        run: echo $DOCKER_PASS | docker login dhi.io -u 0mniteck42 --password-stdin
        env:
          DOCKER_PASS: ${{ secrets.DOCKER }}
      - name: Pull and inspect latest digest
        run: |
          docker pull dhi.io/debian-base:latest
          echo "DIGEST:"
          docker inspect --format '{{index .RepoDigests 0}}' dhi.io/debian-base:latest
