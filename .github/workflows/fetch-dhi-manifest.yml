name: fetch-dhi-manifest
on:
  workflow_dispatch:
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: List tags via Registry API
        run: |
          TOKEN=$(curl -sf -u "0mniteck42:$DOCKER_PASS" 'https://dhi.io/token?service=registry.docker.io&scope=repository:debian-base:pull' | python3 -c 'import sys,json; print(json.load(sys.stdin)["token"])' )
          echo "=== TAGS ==="
          curl -sf -H "Authorization: Bearer $TOKEN" https://dhi.io/v2/debian-base/tags/list
          echo "=== LATEST DIGEST ==="
          LATEST=$(curl -sf -H "Authorization: Bearer $TOKEN" https://dhi.io/v2/debian-base/tags/list | python3 -c 'import sys,json; tags=json.load(sys.stdin).get("tags",[]); tags.sort(); print(tags[-1])')
          echo "Latest tag: $LATEST"
          curl -sf -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.oci.image.manifest.v1+json" -D - https://dhi.io/v2/debian-base/manifests/$LATEST | grep -i docker-content-digest
        env:
          DOCKER_PASS: ${{ secrets.DOCKER }}
