name: yubiOS firmware

# yubiOS ARM64 fTPM Secure-Boot INTEGRATION CI — ORCHESTRATOR (#35, task T219 / F3).
#
# ====================== STATUS: COMMIT-READY (both gates GREEN) ======================
# This is the F3 orchestrator DRAFT. It supersedes the monolithic single-job
# T200 design: instead of one giant `integrate` job, the chain is split into
# THREE jobs, each owning one validated stage-block handed over by a sibling:
#
#   job  stmm        <- F1 / T210 ci_int_stmm.yml      (BL32_AP_MM.fd)
#   job  optee_fip   <- F2 / T211 ci_int_optee_fip.yml (fip.bin + flash.bin)   [LANDED, run RED]
#   job  qemu        <- F4 / T212 ci_int_qemu.yml       (QEMU e2e verify)
#
# Jobs are ordered with `needs:` and pass artifacts in-run (upload-artifact in
# the producer job, download-artifact in the consumer job) along the canonical,
# non-circular build order from knowledge/arm64-ftpm-build-graph.md:
#
#   edk2 StMM (BL32_AP_MM.fd)
#     -> optee_os pass1 (TA dev kit)
#     -> optee_ftpm (fTPM Early TA, UUID bc50d971-…)
#     -> optee_os pass2 (CFG_STMM_PATH=BL32_AP_MM.fd + EARLY_TA_PATHS=fTPM -> single BL32)
#     -> TF-A FIP (SPD=opteed, BL31 + BL32=OP-TEE + BL33=u-boot, TBB) -> fip.bin
#     -> u-boot BL33
#     -> QEMU boot + assert (fTPM Early TA loads + measured-boot event log)
#
# === BOTH STITCH GATES CLEARED 2026-06-26T16:19Z — committing to main ===
#   1. [F2/T211]  GREEN — ci_int_optee_fip.yml run 28248906459 (commit f3473172)
#      SUCCESS on both arches; F2 posted DONE-green. Its verbatim job-block is
#      integrated below as the `optee_fip` job (Stage S adapted to prefer the
#      in-run stmm artifact). No invented steps.
#   2. [F1/T210]  GREEN — ci_int_stmm.yml run 28250336208 (commit ac0becd9)
#      SUCCESS on both arches (BL32_AP_MM-amd64/-arm64, 145717 bytes each);
#      F1 posted DONE-green. The `stmm` job below is re-synced VERBATIM to that
#      GREEN commit (GCCNOLTO tag, MBEDTLS_HAVE_ASM + MBEDTLS_AESCE_C disabled,
#      stage finds the .fd under $WORKSPACE/Build) — the three fixes the earlier
#      RED streak never reached.
#   3. [PINNED.md] CLEARED — actions/download-artifact pinned (37930b1c…); cross-job
#      artifact passing wired in both consumer jobs (stmm->optee_fip->qemu).
#
# BARE runners throughout: the full multi-toolchain cross build + qemu TCG need a
# complete host libc/crt*.o the hardened dhi base omits (same lesson as every
# component CI). Native multi-arch matrix kept for parity (fail-fast:false).
# Pinned action refs per PINNED.md (checkout 9c091bb…, upload-artifact bbbca2dd…, download-artifact 37930b1c…).
# HARD RULES: lands the integration workflow only — no merge, no force-push, no tag.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ci_test-int.yml' # self-change trigger for validating workflow edits
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why are you running this manually?'
        required: false
        default: 'manual'
      Docker_push:
        description: 'Push firmware bundle to Docker Hub (0mniteck/yubios:firmware)?'
        type: boolean
        required: false
        default: false
      ci_callback:
        description: 'Internal: call back to ci.yml when this workflow finishes.'
        required: false
        default: false
        type: boolean
      ci_chain_ref:
        description: 'Internal: ref carried by the ci.yml orchestrator.'
        required: false
        default: ''
        type: string
      ci_reason:
        description: 'Internal: original ci.yml orchestrator reason.'
        required: false
        default: 'manual'
        type: string
      ci_Docker_push:
        description: 'Internal: production image push flag carried by ci.yml.'
        required: false
        default: false
        type: boolean
      ci_Dev_Docker_push:
        description: 'Internal: dev image push flag carried by ci.yml.'
        required: false
        default: false
        type: boolean
      ci_Firmware_Docker_push:
        description: 'Internal: firmware artifact push flag carried by ci.yml.'
        required: false
        default: false
        type: boolean
      ci_Installer_Docker_push:
        description: 'Internal: installer artifact push flag carried by ci.yml.'
        required: false
        default: false
        type: boolean
      ci_vm_image:
        description: 'Internal: VM image ref carried by ci.yml.'
        required: false
        default: 'docker.io/0mniteck/yubios:dev'
        type: string

permissions:
  contents: read
  actions: write

env:
  TFA_REF: f9e106415eb569ff9b19404e2c3f64167af08d21
  OPTEE_OS_REF: 440b10c3f9b1c8501f2550e282ae071bb5424972 # feat/stmm-volatile-storage-ci (CFG_STMM_VOLATILE_STORAGE) — branch referenced directly, not merged
  OPTEE_FTPM_REF: 5e09cdbe1bcb1bc3bcf4875ebafb4e1a1154417c # feat/volatile-nv-ci (CFG_FTPM_VOLATILE_NV) — branch referenced directly, not merged
  UBOOT_REF: ef2ab32418943c161d0889af24375a52b14e10f9
  EDK2_REF: 9f13e2a137c97a2825f874b4321c3963ca87c747
  EDK2_PLATFORMS_REF: 4e1e7a4e64470ef7eefeaa1021c86763ab28beee
  MS_TPM_REF: 98b60a44aba79b15fcce1c0d1e46cf5918400f6a
  FTPM_UUID: bc50d971-d4c9-42c4-82cb-343fb7f37896
  OPTEE_PLATFORM: vexpress-qemu_armv8a
  MBEDTLS_REF: mbedtls-3.6.6

jobs:
  # ===================================================================
  # Stage 1 — EDK2 StandaloneMM RPMB FD  (BL32_AP_MM.fd)
  # Block source: F1 / ci_int_stmm.yml  (job build-bl32-ap-mm)
  # Integrated verbatim from the live, F1-owned stage workflow.
  # ===================================================================
  stmm:
    name: Stage 1 — BL32_AP_MM.fd (StandaloneMM RPMB, AARCH64) ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: [self-hosted, Linux, ARM64, GPU]
    runs-on: ${{ matrix.runner }}
    env:
      EDK2_REPO: https://github.com/yubi-OS/edk2.git
      EDK2_PLATFORMS_REPO: https://github.com/yubi-OS/edk2-platforms.git
      ACTIVE_PLATFORM: Platform/StandaloneMm/PlatformStandaloneMmPkg/PlatformStandaloneMmRpmb.dsc
    steps:
      - name: Install EDK2 build deps
        run: |
          rm -rf /mnt/actions-runner/_work/yubiOS
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential uuid-dev iasl nasm \
            python3 python3-venv python3-pip \
            bison flex libssl-dev \
            gcc-aarch64-linux-gnu git || true

      - name: Clone edk2 + edk2-platforms (yubi-OS forks)
        run: |
          set -eux
          ws="$GITHUB_WORKSPACE/uefi"
          mkdir -p "$ws"
          git clone --filter=tree:0 "$EDK2_REPO" "$ws/edk2"
          git clone --filter=tree:0 "$EDK2_PLATFORMS_REPO" "$ws/edk2-platforms"
          ( cd "$ws/edk2" && git submodule update --init --recursive )
          echo "edk2 HEAD:           $(cd "$ws/edk2" && git rev-parse HEAD)"
          echo "edk2-platforms HEAD: $(cd "$ws/edk2-platforms" && git rev-parse HEAD)"
          test -f "$ws/edk2-platforms/$ACTIVE_PLATFORM"
          test -f "$ws/edk2-platforms/${ACTIVE_PLATFORM%.dsc}.fdf"

      - name: Resolve AARCH64 cross prefix
        id: tc
        run: |
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            echo "prefix=" >> "$GITHUB_OUTPUT"
          else
            echo "prefix=aarch64-linux-gnu-" >> "$GITHUB_OUTPUT"
          fi

      - name: Build BaseTools
        run: make -C "$GITHUB_WORKSPACE/uefi/edk2/BaseTools" -j"$(nproc)"

      - name: Build StandaloneMM RPMB platform (BL32_AP_MM.fd)
        id: build
        run: |
          set -ex
          ws="$GITHUB_WORKSPACE/uefi"
          export WORKSPACE="$ws"
          export PACKAGES_PATH="$ws/edk2:$ws/edk2-platforms"
          export PYTHON_COMMAND=python3
          cd "$ws/edk2"
          . ./edksetup.sh
          # --- Root-cause fix 1: mbedTLS aarch64 inline asm ---------------------
          # constant_time.c:58 `ldr %w0, [%1]` (+ the CT barrier primitives) compile
          # ONLY when MBEDTLS_HAVE_ASM is defined; the cross aarch64 gcc rejects that
          # asm as 'invalid operand'. There is no MBEDTLS_CT_NO_ASM knob in this rev,
          # so flip the master switch off -> portable constant-time C fallback.
          cfg=CryptoPkg/Library/MbedTlsLib/Include/mbedtls/mbedtls_config.h
          sed -i 's@^#define MBEDTLS_HAVE_ASM@/* yubiOS CI: aarch64 inline-asm rejected by cross gcc */ \/\/ #define MBEDTLS_HAVE_ASM@' "$cfg"
          # aes.c calls mbedtls_aesce_* (ARM AES crypto-extension) under MBEDTLS_AESCE_C,
          # but aesce.c's bodies need NEON/crypto intrinsics that -mgeneral-regs-only
          # (StandaloneMM) forbids, so they compile out -> undefined refs at link. Disable
          # the AESCE accel path too; portable C AES is correct for this build-proof FV.
          sed -i 's@^#define MBEDTLS_AESCE_C@/* yubiOS CI: ARM AES-CE needs intrinsics forbidden under -mgeneral-regs-only */ \/\/ #define MBEDTLS_AESCE_C@' "$cfg"
          grep -nE 'MBEDTLS_HAVE_ASM|MBEDTLS_AESCE_C' "$cfg" | head
          # --- Root-cause fix 2: LTO -------------------------------------------
          # Use the GCCNOLTO tag (FAMILY=GCC) instead of GCC: no -flto and none of
          # the GccLto -plugin-opt link flags, so neither the LTO miscompile nor the
          # `ld: bad -plugin-opt option` link error can occur. Belt-and-suspenders:
          # drop any -Werror so stray GCC-14 warnings don't fail a build-proof CI.
          sed -i 's/ -Werror//g' Conf/tools_def.txt
          TAG=GCCNOLTO
          export GCCNOLTO_AARCH64_PREFIX="${{ steps.tc.outputs.prefix }}"
          echo "Using toolchain tag: $TAG (prefix='${GCCNOLTO_AARCH64_PREFIX}')"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          build -a AARCH64 -t "$TAG" -b RELEASE \
            -p "$ACTIVE_PLATFORM" \
            -n "$(nproc)"

      - name: Locate + stage BL32_AP_MM.fd
        id: stage
        run: |
          set -ex
          ws="$GITHUB_WORKSPACE/uefi"
          # EDK2 writes to $WORKSPACE/Build (WORKSPACE=$ws here), not $ws/edk2/Build.
          fd="$(find "$ws/Build" -name 'BL32_AP_MM.fd' | head -n1)"
          test -n "$fd"
          ls -l "$fd"
          file "$fd"
          out="$GITHUB_WORKSPACE/artifacts"
          mkdir -p "$out"
          cp "$fd" "$out/BL32_AP_MM.fd"
          sha256sum "$out/BL32_AP_MM.fd"

      - name: Upload BL32_AP_MM.fd
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # PINNED.md
        with:
          name: BL32_AP_MM-${{ matrix.arch }}
          path: artifacts/BL32_AP_MM.fd
          if-no-files-found: error

  optee_fip:
    name: Stage 2 - OP-TEE fold (StMM+fTPM) + TF-A FIP (fip.bin) ${{ matrix.arch }}
    needs: stmm
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: [self-hosted, Linux, ARM64, GPU]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout yubiOS (workflow context)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # see PINNED.md

      - name: Install full ARM64 firmware toolchain + build deps
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf \
            python3 python3-venv python3-dev \
            python3-pyelftools python3-cryptography python3-setuptools \
            device-tree-compiler \
            openssl libssl-dev libgnutls28-dev \
            bison flex bc \
            uuid-dev iasl nasm swig \
            git ca-certificates || true
          # AArch64 host prefix: cross on amd64, native (empty) on the arm64 runner.
          if [ "$(uname -m)" = "x86_64" ]; then
            echo "AARCH64_PREFIX=aarch64-linux-gnu-" >> "$GITHUB_ENV"
          else
            echo "AARCH64_PREFIX=" >> "$GITHUB_ENV"
          fi

      - name: Download BL32_AP_MM.fd from in-run stmm job
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # PINNED.md
        with:
          name: BL32_AP_MM-${{ matrix.arch }}
          path: stmm_artifact
        continue-on-error: true
      - name: Stage 0 — clone + build U-Boot BL33
        run: |
          set -euxo pipefail
          git clone --no-tags https://github.com/yubi-OS/u-boot u-boot
          git -C u-boot checkout "$UBOOT_REF"
          cat > u-boot/yubios_ftpm.config <<'EOF'
          CONFIG_TEE=y
          CONFIG_OPTEE=y
          CONFIG_TPM=y
          CONFIG_TPM_V2=y
          CONFIG_TPM2_FTPM_TEE=y
          CONFIG_EFI_LOADER=y
          # RESTORED (2026-07-07, #41 fixed): StMM now folds + boots (see Stage 3
          # comment), so U-Boot's EFI variable service can talk to it again.
          CONFIG_EFI_MM_COMM_TEE=y
          CONFIG_EFI_TCG2_PROTOCOL=y
          CONFIG_HASH=y
          CONFIG_MEASURED_BOOT=y
          CONFIG_CMD_TPM=y
          CONFIG_BOOTDELAY=1
          # Exercise the fTPM at autoboot and emit a positive marker the QEMU
          # stage asserts on (proven in ci_int_matrix run 28893676854 variant x1).
          CONFIG_BOOTCOMMAND="tpm2 init && tpm2 startup TPM2_SU_CLEAR && tpm2 self_test full && echo YUBIOS_TPM_OK; bootefi bootmgr"
          # CONFIG_UNIT_TEST is not set
          EOF
          make -C u-boot CROSS_COMPILE="${AARCH64_PREFIX}" ARCH=arm qemu_arm64_defconfig
          ./u-boot/scripts/kconfig/merge_config.sh -m -O u-boot u-boot/.config u-boot/yubios_ftpm.config
          make -C u-boot CROSS_COMPILE="${AARCH64_PREFIX}" ARCH=arm olddefconfig
          make -C u-boot -j"$(nproc)" CROSS_COMPILE="${AARCH64_PREFIX}" ARCH=arm
          test -f u-boot/u-boot.bin
          echo "BL33_BIN=$GITHUB_WORKSPACE/u-boot/u-boot.bin" >> "$GITHUB_ENV"
          ls -l u-boot/u-boot.bin

      - name: Stage S - obtain BL32_AP_MM.fd (prefer in-run stmm job, else F1 run / rebuild)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          fd_dst="$GITHUB_WORKSPACE/BL32_AP_MM.fd"
          art=$(find stmm_artifact -name 'BL32_AP_MM.fd' -print -quit 2>/dev/null || true)
          if [ -n "$art" ]; then
            cp "$art" "$fd_dst"
            echo "STMM_FD=$fd_dst" >> "$GITHUB_ENV"
            echo "STMM_SOURCE=in-run stmm job artifact (F1 ci_int_stmm block)" >> "$GITHUB_ENV"
            echo "::notice::BL32_AP_MM.fd via in-run stmm job"
            ls -l "$fd_dst"
          else
            echo "::notice::no in-run stmm artifact - falling back to F2 download/rebuild path"
            set -euo pipefail
            fd_dst="$GITHUB_WORKSPACE/BL32_AP_MM.fd"
            got=""
            rid=$(gh run list -R "$GITHUB_REPOSITORY" --workflow ci_int_stmm.yml \
                    --status success -L 1 --json databaseId -q '.[0].databaseId' 2>/dev/null || true)
            if [ -n "${rid:-}" ]; then
              echo "Found F1 ci_int_stmm.yml GREEN run: $rid — downloading BL32_AP_MM.fd"
              mkdir -p _stmm_dl
              if gh run download "$rid" -R "$GITHUB_REPOSITORY" -D _stmm_dl 2>/dev/null; then
                cand=$(find _stmm_dl -name 'BL32_AP_MM.fd' -print -quit 2>/dev/null || true)
                if [ -n "$cand" ]; then cp "$cand" "$fd_dst"; got="download(run $rid)"; fi
              fi
            fi
            if [ -z "$got" ]; then
              echo "::notice::No F1 ci_int_stmm.yml artifact yet — best-effort inline StMM rebuild (non-fatal)"
              if (
                set -ex
                sudo apt-get install -y --no-install-recommends iasl nasm uuid-dev || true
                git clone --no-tags https://github.com/yubi-OS/edk2 edk2
                git -C edk2 checkout "$EDK2_REF"
                git -C edk2 submodule update --init --recursive
                git clone --no-tags https://github.com/yubi-OS/edk2-platforms edk2-platforms
                git -C edk2-platforms checkout "$EDK2_PLATFORMS_REF"
                export GCC_AARCH64_PREFIX="${AARCH64_PREFIX}"
                export WORKSPACE="$GITHUB_WORKSPACE"
                export PACKAGES_PATH="$GITHUB_WORKSPACE/edk2:$GITHUB_WORKSPACE/edk2-platforms"
                export EDK_TOOLS_PATH="$GITHUB_WORKSPACE/edk2/BaseTools"
                dsc=edk2-platforms/Platform/StandaloneMm/PlatformStandaloneMmPkg/PlatformStandaloneMmRpmb.dsc
                printf '\n[BuildOptions]\n  GCC:*_*_*_CC_FLAGS = -fno-lto -Wno-error=maybe-uninitialized\n  GCC:*_*_*_DLINK_FLAGS == -fno-lto\n' >> "$dsc"
                make -C edk2/BaseTools -j"$(nproc)"
                set +u; . edk2/edksetup.sh BaseTools; set -u
                build -a AARCH64 -t GCC -b DEBUG -n "$(nproc)" \
                  -p Platform/StandaloneMm/PlatformStandaloneMmPkg/PlatformStandaloneMmRpmb.dsc
                fd=$(find "$WORKSPACE/Build" -path '*MmStandaloneRpmb*' -name '*.fd' -print -quit 2>/dev/null || true)
                test -n "$fd"
                cp "$fd" "$fd_dst"
              ); then
                got="rebuild(edk2-platforms $EDK2_PLATFORMS_REF)"
              else
                echo "::warning::inline StMM rebuild failed — proceeding fTPM-only (StMM folds once F1 ci_int_stmm.yml is GREEN)"
              fi
            fi
            if [ -n "$got" ] && [ -f "$fd_dst" ]; then
              echo "STMM_FD=$fd_dst" >> "$GITHUB_ENV"
              echo "STMM_SOURCE=$got" >> "$GITHUB_ENV"
              echo "::notice::BL32_AP_MM.fd via $got"
              ls -l "$fd_dst"
            else
              echo "STMM_FD=" >> "$GITHUB_ENV"
              echo "STMM_SOURCE=pending-F1 (fTPM-only fold this run)" >> "$GITHUB_ENV"
              echo "::notice::StMM fold deferred — fTPM-only OP-TEE BL32 this run"
            fi
          fi
      - name: Stage 1 — clone + build OP-TEE TA dev kit (pass 1)
        run: |
          set -euxo pipefail
          git clone --no-tags https://github.com/yubi-OS/optee_os optee_os
          git -C optee_os checkout "$OPTEE_OS_REF"
          make -C optee_os -j"$(nproc)" \
            PLATFORM="$OPTEE_PLATFORM" \
            CROSS_COMPILE64=aarch64-linux-gnu- \
            CROSS_COMPILE=arm-linux-gnueabihf- \
            CFG_RPMB_FS=y CFG_REE_FS=n CFG_EARLY_TA=y \
            CFG_STMM_VOLATILE_STORAGE=y \
            CFG_CORE_HEAP_SIZE=524288 CFG_TEE_RAM_VA_SIZE=0x00400000 \
            CFG_TEE_CORE_LOG_LEVEL=3 CFG_TEE_TA_LOG_LEVEL=3 \
            ta_dev_kit
          devkit=$(find "$GITHUB_WORKSPACE/optee_os/out" -type d -name 'export-ta_arm64' -print -quit)
          test -f "$devkit/mk/ta_dev_kit.mk"
          echo "TA_DEV_KIT_DIR=$devkit" >> "$GITHUB_ENV"
          echo "OK devkit -> $devkit"

      - name: Stage 2 — build fTPM TA vs devkit + ms-tpm-20-ref
        run: |
          set -euxo pipefail
          git clone --no-tags https://github.com/yubi-OS/optee_ftpm optee_ftpm
          git -C optee_ftpm checkout "$OPTEE_FTPM_REF"
          git clone --no-tags https://github.com/yubi-OS/ms-tpm-20-ref ms-tpm-20-ref
          git -C ms-tpm-20-ref checkout "$MS_TPM_REF"
          make -C optee_ftpm -j"$(nproc)" \
            CFG_FTPM_VOLATILE_NV=y \
            TA_DEV_KIT_DIR="$TA_DEV_KIT_DIR" \
            CFG_MS_TPM_20_REF="$GITHUB_WORKSPACE/ms-tpm-20-ref" \
            CROSS_COMPILE_ta_arm64=aarch64-linux-gnu- \
            CFG_ARM64_ta_arm64=y
          stripped=$(find optee_ftpm -name "${FTPM_UUID}.stripped.elf" -print -quit)
          test -n "$stripped"
          echo "FTPM_TA=$GITHUB_WORKSPACE/$stripped" >> "$GITHUB_ENV"
          echo "OK fTPM TA -> $stripped"

      - name: Stage 3 — rebuild OP-TEE BL32 folding fTPM Early TA (+ StMM when present)
        run: |
          set -euxo pipefail
          STMM_ARG=""
          if [ -n "${STMM_FD:-}" ] && [ -f "${STMM_FD}" ]; then
            STMM_ARG="CFG_STMM_PATH=$STMM_FD"
            echo "folding StMM: $STMM_ARG (source: $STMM_SOURCE)"
          else
            echo "::warning::StMM .fd absent — fTPM-only OP-TEE BL32 this run ($STMM_SOURCE)"
          fi
          make -C optee_os -j"$(nproc)" \
            PLATFORM="$OPTEE_PLATFORM" \
            CROSS_COMPILE64=aarch64-linux-gnu- \
            CROSS_COMPILE=arm-linux-gnueabihf- \
            CFG_RPMB_FS=y CFG_REE_FS=n \
            CFG_STMM_VOLATILE_STORAGE=y \
            CFG_CORE_HEAP_SIZE=524288 CFG_TEE_RAM_VA_SIZE=0x00400000 \
            CFG_EARLY_TA=y EARLY_TA_PATHS="$FTPM_TA" \
            CFG_CORE_DYN_SHM=y \
            CFG_TEE_CORE_LOG_LEVEL=3 CFG_TEE_TA_LOG_LEVEL=3 \
            $STMM_ARG \
            all
          h=$(find optee_os/out -name tee-header_v2.bin -print -quit)
          p=$(find optee_os/out -name tee-pager_v2.bin -print -quit)
          x=$(find optee_os/out -name tee-pageable_v2.bin -print -quit)
          test -n "$h" && test -n "$p" && test -n "$x"
          echo "BL32_HDR=$GITHUB_WORKSPACE/$h"   >> "$GITHUB_ENV"
          echo "BL32_PAGER=$GITHUB_WORKSPACE/$p" >> "$GITHUB_ENV"
          echo "BL32_PAGEABLE=$GITHUB_WORKSPACE/$x" >> "$GITHUB_ENV"
          ls -l "$h" "$p" "$x"

      - name: Stage 4 — clone TF-A + mbedTLS, build TBB FIP (SPD=opteed)
        run: |
          set -euxo pipefail
          git clone --no-tags https://github.com/yubi-OS/arm-trusted-firmware arm-trusted-firmware
          git -C arm-trusted-firmware checkout "$TFA_REF"
          git clone --no-tags --branch "$MBEDTLS_REF" https://github.com/Mbed-TLS/mbedtls mbedtls
          CROSS=""
          [ "$(uname -m)" = "x86_64" ] && CROSS="aarch64-linux-gnu-"
          make -C arm-trusted-firmware -j"$(nproc)" \
            CROSS_COMPILE="${CROSS}" \
            PLAT=qemu ARCH=aarch64 \
            SPD=opteed \
            BL32="$BL32_HDR" BL32_EXTRA1="$BL32_PAGER" BL32_EXTRA2="$BL32_PAGEABLE" \
            BL32_RAM_LOCATION=tdram \
            BL33="$BL33_BIN" \
            TRUSTED_BOARD_BOOT=1 GENERATE_COT=1 CREATE_KEYS=1 \
            MBEDTLS_DIR="$GITHUB_WORKSPACE/mbedtls" \
            DEBUG=1 \
            all fip
          fip=$(find arm-trusted-firmware/build -name fip.bin -print -quit)
          test -n "$fip"
          echo "FIP_BIN=$GITHUB_WORKSPACE/$fip" >> "$GITHUB_ENV"
          flash=$(find arm-trusted-firmware/build -name flash.bin -print -quit || true)
          if [ -n "$flash" ]; then echo "FLASH_BIN=$GITHUB_WORKSPACE/$flash" >> "$GITHUB_ENV"; fi
          ls -l "$fip" ${flash:+"$flash"}

      - name: Verify packaged FIP carries OP-TEE BL32 + U-Boot BL33
        run: |
          set -euxo pipefail
          ft=arm-trusted-firmware/tools/fiptool/fiptool
          test -x "$ft" || make -C arm-trusted-firmware fiptool
          "$ft" info "$FIP_BIN" | tee fip-info.txt
          grep -qi 'Secure Payload BL32 (Trusted OS)\|tos-fw\|Trusted OS' fip-info.txt
          grep -qi 'Non-Trusted Firmware BL33\|nt-fw\|Non-Trusted' fip-info.txt
          echo "INT lane I-B OK: fip.bin bundles fTPM+StMM-folded OP-TEE BL32 + U-Boot BL33 (StMM via $STMM_SOURCE)"

      - name: Upload fip + flash (+ OP-TEE fold artifacts) for qemu stage
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # PINNED.md
        with:
          name: fip-flash-${{ matrix.arch }}
          path: |
            arm-trusted-firmware/build/**/fip.bin
            arm-trusted-firmware/build/**/flash.bin
            arm-trusted-firmware/build/**/bl1.bin
            BL32_AP_MM.fd
            optee_os/out/**/tee-*_v2.bin
            u-boot/u-boot.bin
            fip-info.txt
          if-no-files-found: warn
          retention-days: 7

  qemu:
    name: Stage 3 — QEMU fTPM e2e (${{ matrix.arch }})
    needs: optee_fip
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: [self-hosted, Linux, ARM64, GPU]
    runs-on: ${{ matrix.runner }}
    env:
      BOOT_TIMEOUT: '180'
    steps:
      - name: Checkout yubiOS (workflow + harness)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # PINNED.md

      - name: Install QEMU (aarch64 system emulation) + TPM tooling
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-arm qemu-utils tpm2-tools python3 coreutils ca-certificates ipxe-qemu || true
          qemu-system-aarch64 --version

      - name: Download fip/flash from optee_fip job
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # PINNED.md
        with:
          name: fip-flash-${{ matrix.arch }}
          path: image

      - name: Resolve / assemble flash.bin (dd bl1@0 + fip@seek=64)
        id: image
        run: |
          set -euxo pipefail
          flash="$(find image -name flash.bin -type f -print -quit 2>/dev/null || true)"
          if [ -z "${flash}" ]; then
            bl1="$(find image -name bl1.bin -type f -print -quit 2>/dev/null || true)"
            fip="$(find image -name fip.bin -type f -print -quit 2>/dev/null || true)"
            if [ -n "${bl1}" ] && [ -n "${fip}" ]; then
              dd if="${bl1}" of=image/flash.bin bs=4096 conv=notrunc
              dd if="${fip}" of=image/flash.bin seek=64 bs=4096 conv=notrunc
              flash="image/flash.bin"
            fi
          fi
          if [ -n "${flash}" ]; then
            echo "flash=${flash}" >> "$GITHUB_OUTPUT"; echo "ready=1" >> "$GITHUB_OUTPUT"; ls -l "${flash}"
          else
            echo "ready=0" >> "$GITHUB_OUTPUT"
            echo "::warning title=No bootable image::optee_fip produced no flash.bin/fip.bin — LOUD-SKIP boot asserts."
          fi

      - name: Boot the stitched image under QEMU + ASSERT fTPM Early TA + measured-boot log
        if: steps.image.outputs.ready == '1'
        run: |
          set -euxo pipefail
          timeout "${BOOT_TIMEOUT}" qemu-system-aarch64 \
            -M virt,secure=on -cpu max -m 2048 \
            -bios "${{ steps.image.outputs.flash }}" \
            -nographic -d guest_errors \
            -serial file:nw.log -serial file:optee.log || true
          echo "=== QEMU log sizes ===" || true
          wc -l nw.log optee.log 2>/dev/null || true
          echo "--- nw.log head 20 ---" || true
          head -20 nw.log 2>/dev/null || echo "(empty)"
          echo "--- optee.log: searching for OP-TEE/fTPM/STMM/ERROR lines ---" || true
          grep -i "optee\|tee\|early_ta\|stmm\|bc50d971\|fTPM\|panic\|ERROR\|Fault\|abort\|Loading\|Starting\|initialized" optee.log 2>/dev/null | head -60 || echo "(no matches or empty)"
          echo "--- optee.log tail 20 ---" || true
          tail -20 optee.log 2>/dev/null || echo "(empty)"
          echo "=== end serial dump ==="
          fail=0; touch optee.log nw.log
          grep -Eiq "early_ta_init.*${FTPM_UUID}|Early TA ${FTPM_UUID}" nw.log optee.log \
            && echo "PASS: fTPM Early TA at init" || { echo "::error::fTPM Early TA not at init"; fail=1; }
          grep -Eiq "ldelf: Loading TS ${FTPM_UUID}|Lookup user TA ELF ${FTPM_UUID}" nw.log optee.log \
            && echo "PASS: fTPM TA probed" || { echo "::error::fTPM TA never probed"; fail=1; }
          grep -q "YUBIOS_TPM_OK" nw.log \
            && echo "PASS: fTPM functional (init+startup+self_test)" || { echo "::error::fTPM not functional (no YUBIOS_TPM_OK)"; fail=1; }
          ! grep -Eq "Missing TPMv2 device|Couldn't set TPM|TA panicked|ldelf failed|data-abort" nw.log optee.log \
            && echo "PASS: no known failure signatures" || { echo "::error::known failure signature present"; fail=1; }
          grep -Eiq "stmm load address" nw.log optee.log \
            && echo "PASS: StMM SP loaded into OP-TEE" || { echo "::error::StMM SP never loaded"; fail=1; }
          [ "${fail}" -eq 0 ] && echo "INTEGRATION e2e VERIFIED" || { echo "INTEGRATION e2e FAILED"; exit 1; }

      - name: LOUD-SKIP — no bootable image from optee_fip
        if: steps.image.outputs.ready != '1'
        run: |
          echo "::notice title=QEMU e2e LOUD-SKIP::optee_fip (F2/T211) produced no fip/flash yet. Wired, no faked PASS."

  firmware-publish:
    name: Stage 4 — Publish firmware bundle (0mniteck/yubios:firmware)
    needs: qemu
    if: github.event_name == 'workflow_dispatch' && inputs.Docker_push == true
    runs-on: ubuntu-24.04
    steps:
      - name: Download firmware artifacts (native arm64 build)
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # PINNED.md
        with:
          name: fip-flash-arm64
          path: art

      - name: Install docker-engine + buildx (pinned, private dockerd on ducker.sock)
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends wget iptables nftables || true
          wget -q "https://download.docker.com/linux/static/stable/x86_64/docker-29.6.0.tgz"
          wget -q "https://github.com/docker/buildx/releases/download/v0.35.0/buildx-v0.35.0.linux-amd64"
          tar xzf docker-29.6.0.tgz
          docker_bin="${RUNNER_TEMP}/docker-static/bin"
          docker_plugins="${HOME}/.docker/cli-plugins"
          mkdir -p "$docker_bin" "$docker_plugins"
          sudo mkdir -p /mnt/docker /var/run
          install -m 0755 docker/* "$docker_bin/"
          install -m 0755 buildx-v0.35.0.linux-amd64 "$docker_plugins/docker-buildx"
          echo "$docker_bin" >> "$GITHUB_PATH"
          export PATH="$docker_bin:$PATH"
          sudo env PATH="$docker_bin:$PATH" "$docker_bin/dockerd" \
            --storage-driver=overlayfs \
            --data-root=/mnt/docker \
            --pidfile "${RUNNER_TEMP}/ducker.pid" \
            -H unix:///var/run/ducker.sock &
          for i in $(seq 1 30); do sudo env PATH="$docker_bin:$PATH" "$docker_bin/docker" -H unix:///var/run/ducker.sock info >/dev/null 2>&1 && break; sleep 1; done
          sudo env PATH="$docker_bin:$PATH" "$docker_bin/docker" -H unix:///var/run/ducker.sock buildx create --name hardened \
            --driver docker-container \
            --use

      - name: Assemble /firmware payload + MANIFEST
        run: |
          set -euxo pipefail
          mkdir -p fw/firmware
          find art -name fip.bin        -exec cp {} fw/firmware/ \; -quit
          find art -name flash.bin      -exec cp {} fw/firmware/ \; -quit
          find art -name bl1.bin        -exec cp {} fw/firmware/ \; -quit
          find art -name BL32_AP_MM.fd  -exec cp {} fw/firmware/ \; -quit
          find art -name u-boot.bin     -exec cp {} fw/firmware/ \; -quit
          find art -name fip-info.txt   -exec cp {} fw/firmware/ \; -quit
          find art -name 'tee-*_v2.bin' -exec cp {} fw/firmware/ \;
          if [ ! -s fw/firmware/flash.bin ]; then
            dd if=fw/firmware/bl1.bin of=fw/firmware/flash.bin bs=4096 conv=notrunc
            dd if=fw/firmware/fip.bin of=fw/firmware/flash.bin seek=64 bs=4096 conv=notrunc
          fi
          test -s fw/firmware/fip.bin
          test -s fw/firmware/bl1.bin
          test -s fw/firmware/flash.bin
          test -s fw/firmware/BL32_AP_MM.fd
          {
            echo "yubiOS ARM64 firmware bundle — QEMU-validated (vexpress-qemu_armv8a)"
            echo "yubios_commit=${GITHUB_SHA}"
            echo "workflow_run=${GITHUB_RUN_ID}"
            echo "tfa_ref=${TFA_REF}"
            echo "optee_os_ref=${OPTEE_OS_REF} (feat/stmm-volatile-storage-ci)"
            echo "optee_ftpm_ref=${OPTEE_FTPM_REF} (feat/volatile-nv-ci)"
            echo "uboot_ref=${UBOOT_REF}"
            echo "edk2_ref=${EDK2_REF}"
            echo "edk2_platforms_ref=${EDK2_PLATFORMS_REF}"
            echo "ms_tpm_ref=${MS_TPM_REF}"
            echo "ftpm_uuid=${FTPM_UUID}"
            echo "platform=${OPTEE_PLATFORM}"
            echo "NOTE: QEMU lane firmware. CFG_STMM_VOLATILE_STORAGE + CFG_FTPM_VOLATILE_NV"
            echo "are enabled here because QEMU virt has no RPMB. Real-hardware builds keep"
            echo "RPMB-backed storage for both StMM and the fTPM (ADR-018/019/020)."
          } > fw/firmware/MANIFEST.txt
          ls -l fw/firmware/

      - name: Build firmware OCI artifact (FROM scratch)
        run: |
          set -euxo pipefail
          cat > fw/Dockerfile <<'DOCKER'
          FROM scratch
          COPY firmware/ /firmware/
          DOCKER
          docker -H unix:///var/run/ducker.sock buildx build \
            --label "org.opencontainers.image.title=yubiOS ARM64 firmware bundle" \
            --label "org.opencontainers.image.description=QEMU-validated TF-A FIP + OP-TEE (StMM+fTPM fold) + U-Boot BL33 + BL32_AP_MM.fd" \
            --label "org.opencontainers.image.source=https://github.com/yubi-OS/yubiOS" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --load \
            -t "0mniteck/yubios:firmware" \
            -t "0mniteck/yubios:firmware-${GITHUB_SHA}" \
            fw

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER }}" | docker -H unix:///var/run/ducker.sock login -u 0mniteck42 --password-stdin

      - name: Push firmware tags
        run: |
          set -euxo pipefail
          docker -H unix:///var/run/ducker.sock push "0mniteck/yubios:firmware"
          docker -H unix:///var/run/ducker.sock push "0mniteck/yubios:firmware-${GITHUB_SHA}"
          docker -H unix:///var/run/ducker.sock logout

      - name: Verify pushed tag
        run: docker -H unix:///var/run/ducker.sock buildx imagetools inspect "0mniteck/yubios:firmware"

  ci-callback:
    name: Callback to ci.yml orchestrator
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.ci_callback == true }}
    needs: [stmm, optee_fip, qemu, firmware-publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    steps:
      - name: Report current state to ci.yml
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WORKFLOW_NAME: ${{ github.workflow }}
          REF: ${{ inputs.ci_chain_ref != '' && inputs.ci_chain_ref || github.ref_name }}
          NEEDS_JSON: ${{ toJSON(needs) }}
          CI_REASON: ${{ inputs.ci_reason }}
          CI_DOCKER_PUSH: ${{ inputs.ci_Docker_push }}
          CI_DEV_DOCKER_PUSH: ${{ inputs.ci_Dev_Docker_push }}
          CI_FIRMWARE_DOCKER_PUSH: ${{ inputs.ci_Firmware_Docker_push }}
          CI_INSTALLER_DOCKER_PUSH: ${{ inputs.ci_Installer_Docker_push }}
          CI_VM_IMAGE: ${{ inputs.ci_vm_image }}
        run: |
          set -euo pipefail
          conclusion=$(jq -r 'if any(to_entries[]; .value.result == "failure" or .value.result == "cancelled") then "failure" else "success" end' <<<"$NEEDS_JSON")
          payload=$(jq -n \
            --arg ref "$REF" \
            --arg state "$WORKFLOW_NAME" \
            --arg completed_conclusion "$conclusion" \
            --arg reason "$CI_REASON" \
            --arg Docker_push "$CI_DOCKER_PUSH" \
            --arg Dev_Docker_push "$CI_DEV_DOCKER_PUSH" \
            --arg Firmware_Docker_push "$CI_FIRMWARE_DOCKER_PUSH" \
            --arg Installer_Docker_push "$CI_INSTALLER_DOCKER_PUSH" \
            --arg vm_image "$CI_VM_IMAGE" \
            '{ref: $ref, inputs: {state: $state, completed_conclusion: $completed_conclusion, reason: $reason, target_ref: $ref, Docker_push: $Docker_push, Dev_Docker_push: $Dev_Docker_push, Firmware_Docker_push: $Firmware_Docker_push, Installer_Docker_push: $Installer_Docker_push, vm_image: $vm_image}}')
          curl -fsS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/actions/workflows/ci.yml/dispatches" \
            -d "$payload"
          echo "Reported ${WORKFLOW_NAME} as ${conclusion} to ci.yml."
