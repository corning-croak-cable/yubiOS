name: zernike-caustics

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'recon or classify'
        required: false
        default: 'classify'

permissions:
  contents: read

jobs:
  caustics:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install numpy
        run: python3 -m pip install --quiet 'numpy==2.1.3'
      - name: Run F4 caustic classification
        env:
          MODE: ${{ github.event.inputs.mode }}
        run: python3 papers/scripts/f4_caustic_classify.py --mode "$MODE"
