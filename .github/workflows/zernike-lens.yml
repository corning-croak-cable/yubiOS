name: zernike-lens

on:
  workflow_dispatch:

jobs:
  zernike-lens:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install numpy
        run: python3 -m pip install --quiet --upgrade numpy

      - name: Zernike Slot 1 -- aberrated Gap D lens
        run: python3 papers/scripts/gapD_zernike_lens.py --seed 20260824
