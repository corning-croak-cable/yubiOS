name: atomicity-stability
on:
  push:
    branches: [atomicity-stability]
  workflow_dispatch:
jobs:
  stability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install numpy
        run: pip install numpy
      - name: gate test - expect exit 0 on the recorded negative
        run: python3 tools/spectral-defocus/defocus.py --admit-null --n-null 50
