name: zernike-spectrum

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zernike:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install numpy
        run: python3 -m pip install --quiet 'numpy==2.1.3'
      - name: Selftest
        run: python3 tools/zernike-spectrum/zernike.py --selftest
      - name: Corpus spectrum + admission test
        run: python3 tools/zernike-spectrum/zernike.py --corpus --n-null 30 --trades-per-row 20
