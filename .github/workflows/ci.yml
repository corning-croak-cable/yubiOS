name: ci

# Top-level yubiOS CI orchestrator.
#
# Documentation grounding: README.md/MISSION.md/SPEC.md define the FIDO2-first
# OS deliverable; ADR.md, ARCHITECTURE.md, FUTURE.md, MITIGATE.md, BLOCKERS.md,
# TODO.md, ONBOARDING.md, MAINTAINER.md, SAUNA_TOOLS.md, CITATION.md, PINNED.md,
# and refs/*.md define the current CI contract, artifact order, pinned action/image
# policy, and the ARM64 fTPM + VM-e2e constraints this workflow sequences.
#
# This file intentionally DISPATCHES existing workflows instead of duplicating
# their jobs.  It carries each callee's workflow_dispatch defaults forward and
# uses workflow_run completions to advance the chain in a deterministic order.

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why are you running the overarching CI orchestrator?'
        required: false
        default: 'manual'
        type: string
      target_ref:
        description: 'Branch or tag ref to dispatch. Leave empty to use this run ref.'
        required: false
        default: ''
        type: string
      Docker_push:
        description: 'Push the production multi-arch yubiOS image from yubiOS-ci.yml?'
        required: true
        default: false
        type: boolean
      Dev_Docker_push:
        description: 'Push the dev/test swu2f image from ci_dev_image.yml?'
        required: true
        default: false
        type: boolean
      Firmware_Docker_push:
        description: 'Push the firmware OCI artifact from ci_test-int.yml?'
        required: true
        default: false
        type: boolean
      Installer_Docker_push:
        description: 'Push the installer OCI artifact from ci_mkosi-installer.yml?'
        required: true
        default: false
        type: boolean
      vm_image:
        description: 'Pullable yubiOS OCI image ref for ci_test-vm.yml.'
        required: true
        default: 'docker.io/0mniteck/yubios:dev'
        type: string
  workflow_run:
    workflows:
      - fetch-dhi-manifest
      - ci_fork_mkosi
      - ci_fork_bcvk
      - ci_fork_arm-trusted-firmware
      - ci_fork_optee_os
      - ci_fork_ms-tpm-20-ref
      - ci_fork_optee_ftpm
      - ci_fork_u-boot
      - ci_fork_edk2
      - ci_int_stmm
      - ci_int_optee_fip
      - ci_int_qemu
      - ci_test-int
      - yubiOS CI
      - yubiOS dev/test image (swu2f, ADR-026)
      - yubiOS VM e2e (tests/vm)
      - ci_mkosi-installer
      - PQ hybrid TLS verification (ADR-025)
    types:
      - completed

permissions:
  contents: read
  actions: write

jobs:
  start:
    name: Start ordered CI chain
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch first workflow with carried defaults
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ inputs.target_ref != '' && inputs.target_ref || github.ref_name }}
          REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          payload=$(jq -n --arg ref "$REF" --arg reason "$REASON" \
            '{ref: $ref, inputs: {reason: $reason}}')
          curl -fsS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/actions/workflows/fetch-dhi-manifest.yml/dispatches" \
            -d "$payload"
          echo "Dispatched fetch-dhi-manifest.yml on ${REF}."

  continue:
    name: Continue ordered CI chain
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch next workflow on successful completion
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          COMPLETED_WORKFLOW: ${{ github.event.workflow_run.name }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          REF: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          if [ "$CONCLUSION" != "success" ]; then
            echo "Not continuing: ${COMPLETED_WORKFLOW} concluded ${CONCLUSION}."
            exit 0
          fi

          next_file=''
          inputs_json='{}'
          case "$COMPLETED_WORKFLOW" in
            fetch-dhi-manifest)
              next_file='ci_fork_mkosi.yml'
              inputs_json=$(jq -n --arg reason "ci orchestrator after ${COMPLETED_WORKFLOW}@${HEAD_SHA}" '{reason: $reason}')
              ;;
            ci_fork_mkosi)
              next_file='ci_fork_bcvk.yml'
              inputs_json=$(jq -n --arg reason "ci orchestrator after ${COMPLETED_WORKFLOW}@${HEAD_SHA}" '{reason: $reason}')
              ;;
            ci_fork_bcvk)
              next_file='ci_fork_arm-trusted-firmware.yml'
              inputs_json=$(jq -n --arg reason "ci orchestrator after ${COMPLETED_WORKFLOW}@${HEAD_SHA}" '{reason: $reason}')
              ;;
            ci_fork_arm-trusted-firmware)
              next_file='ci_fork_optee-os.yml'
              inputs_json=$(jq -n --arg reason "ci orchestrator after ${COMPLETED_WORKFLOW}@${HEAD_SHA}" '{reason: $reason}')
              ;;
            ci_fork_optee_os)
              next_file='ci_fork_ms-tpm-20-ref.yml'
              inputs_json=$(jq -n --arg reason "ci orchestrator after ${COMPLETED_WORKFLOW}@${HEAD_SHA}" '{reason: $reason}')
              ;;
            ci_fork_ms-tpm-20-ref)
              next_file='ci_fork_optee-ftpm.yml'
              inputs_json=$(jq -n --arg reason "ci orchestrator after ${COMPLETED_WORKFLOW}@${HEAD_SHA}" '{reason: $reason}')
              ;;
            ci_fork_optee_ftpm)
              next_file='ci_fork_u-boot.yml'
              inputs_json=$(jq -n --arg reason "ci orchestrator after ${COMPLETED_WORKFLOW}@${HEAD_SHA}" '{reason: $reason}')
              ;;
            ci_fork_u-boot)
              next_file='ci_fork_edk2.yml'
              inputs_json=$(jq -n --arg reason "ci orchestrator after ${COMPLETED_WORKFLOW}@${HEAD_SHA}" '{reason: $reason}')
              ;;
            ci_fork_edk2)
              next_file='ci_int_stmm.yml'
              inputs_json=$(jq -n --arg reason "ci orchestrator after ${COMPLETED_WORKFLOW}@${HEAD_SHA}" '{reason: $reason}')
              ;;
            ci_int_stmm)
              next_file='ci_int_optee_fip.yml'
              inputs_json=$(jq -n --arg reason "ci orchestrator after ${COMPLETED_WORKFLOW}@${HEAD_SHA}" '{reason: $reason}')
              ;;
            ci_int_optee_fip)
              next_file='ci_int_qemu.yml'
              inputs_json=$(jq -n --arg reason "ci orchestrator after ${COMPLETED_WORKFLOW}@${HEAD_SHA}" '{reason: $reason}')
              ;;
            ci_int_qemu)
              next_file='ci_test-int.yml'
              inputs_json=$(jq -n --arg reason "ci orchestrator after ${COMPLETED_WORKFLOW}@${HEAD_SHA}" '{reason: $reason, Docker_push: "false"}')
              ;;
            ci_test-int)
              next_file='yubiOS-ci.yml'
              inputs_json=$(jq -n '{Docker_push: "false"}')
              ;;
            'yubiOS CI')
              next_file='ci_dev_image.yml'
              inputs_json=$(jq -n '{Docker_push: "false"}')
              ;;
            'yubiOS dev/test image (swu2f, ADR-026)')
              next_file='ci_test-vm.yml'
              inputs_json=$(jq -n '{image: "docker.io/0mniteck/yubios:dev"}')
              ;;
            'yubiOS VM e2e (tests/vm)')
              next_file='ci_mkosi-installer.yml'
              inputs_json=$(jq -n --arg reason "ci orchestrator after ${COMPLETED_WORKFLOW}@${HEAD_SHA}" '{reason: $reason, Docker_push: "false"}')
              ;;
            ci_mkosi-installer)
              next_file='ci_pq_tls_verify.yml'
              inputs_json='{}'
              ;;
            'PQ hybrid TLS verification (ADR-025)')
              echo 'Ordered CI chain complete.'
              exit 0
              ;;
            *)
              echo "No next workflow configured for ${COMPLETED_WORKFLOW}."
              exit 0
              ;;
          esac

          payload=$(jq -n --arg ref "$REF" --argjson inputs "$inputs_json" \
            '{ref: $ref, inputs: $inputs}')
          curl -fsS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/actions/workflows/${next_file}/dispatches" \
            -d "$payload"
          echo "Dispatched ${next_file} on ${REF} after ${COMPLETED_WORKFLOW}@${HEAD_SHA}."
