name: CI

# Top-level yubiOS CI state machine.
#
# Documentation grounding: README.md/MISSION.md/SPEC.md define the FIDO2-first
# OS deliverable; ADR.md, ARCHITECTURE.md, FUTURE.md, MITIGATE.md, BLOCKERS.md,
# TODO.md, ONBOARDING.md, MAINTAINER.md, SAUNA_TOOLS.md, CITATION.md, PINNED.md,
# and refs/*.md define the CI contract, artifact order, pinned action/image
# policy, and ARM64 fTPM + VM-e2e constraints this workflow sequences.
#
# Existing workflow files call back here with the current chain state. This keeps
# dispatch inputs (push flags, VM image, target ref) explicit instead of relying
# on workflow_run, whose event payload cannot carry the original workflow_dispatch
# inputs across the chain.
#
# Every Docker build invoked by the non-ci_fork portion of this chain is defined
# in yubiOS-bake.hcl. This file retains only GitHub dispatch/state semantics.

on:
  workflow_dispatch:
    inputs:
      state:
        description: 'Current orchestrator state: start, or the completed workflow name.'
        required: true
        default: 'start'
        type: string
      completed_conclusion:
        description: 'Conclusion reported by the callback workflow.'
        required: true
        default: 'success'
        type: string
      reason:
        description: 'Why are you running the overarching CI orchestrator?'
        required: false
        default: 'manual'
        type: string
      target_ref:
        description: 'Branch or tag ref to dispatch. Leave empty to use this run ref.'
        required: false
        default: ''
        type: string
      Docker_push:
        description: 'Push the production multi-arch yubiOS image from yubiOS-ci.yml?'
        required: true
        default: false
        type: boolean
      Dev_Docker_push:
        description: 'Push the dev/test swu2f image from ci_dev_image.yml?'
        required: true
        default: false
        type: boolean
      Firmware_Docker_push:
        description: 'Push the firmware OCI artifacts from ci_firmware-rk.yml?'
        required: true
        default: false
        type: boolean
      Installer_Docker_push:
        description: 'Push the installer OCI artifact from ci_mkosi-installer.yml?'
        required: true
        default: false
        type: boolean
      ci_fork_run:
        description: 'Run the ci_fork_* component workflows in the orchestrated chain?'
        required: true
        default: false
        type: boolean
      ci_test_run:
        description: 'Run the ci_test_* validation workflows and the final VM e2e?'
        required: true
        default: false
        type: boolean
      vm_image:
        description: 'Pullable yubiOS OCI image ref for the final ci_test-vm.yml run.'
        required: true
        default: 'docker.io/0mniteck/yubios:dev'
        type: string

permissions:
  contents: read
  actions: write

jobs:
  dispatch-next:
    name: Dispatch next workflow from current state
    runs-on: ubuntu-24.04
    steps:
      - name: Resolve and dispatch next workflow
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          STATE: ${{ inputs.state }}
          COMPLETED_CONCLUSION: ${{ inputs.completed_conclusion }}
          REF: ${{ inputs.target_ref != '' && inputs.target_ref || github.ref_name }}
          REASON: ${{ inputs.reason }}
          DOCKER_PUSH: ${{ inputs.Docker_push }}
          DEV_DOCKER_PUSH: ${{ inputs.Dev_Docker_push }}
          FIRMWARE_DOCKER_PUSH: ${{ inputs.Firmware_Docker_push }}
          INSTALLER_DOCKER_PUSH: ${{ inputs.Installer_Docker_push }}
          CI_FORK_RUN: ${{ inputs.ci_fork_run }}
          CI_TEST_RUN: ${{ inputs.ci_test_run }}
          VM_IMAGE: ${{ inputs.vm_image }}
        run: |
          set -euo pipefail

          if [ "$COMPLETED_CONCLUSION" != "success" ]; then
            echo "::error::CI chain stopped at '${STATE}' with conclusion '${COMPLETED_CONCLUSION}'."
            exit 1
          fi

          next_file=''
          callee_inputs='{}'
          case "$STATE" in
            start)
              next_file='fetch-dhi-manifest.yml'
              callee_inputs=$(jq -n --arg reason "$REASON" '{reason: $reason}')
              ;;
            fetch-dhi-manifest)
              next_file='fetch-fedora-bootc-manifest.yml'
              callee_inputs=$(jq -n --arg reason "ci after fetch-dhi-manifest" '{reason: $reason}')
              ;;
            fetch-fedora-bootc-manifest)
              if [ "$CI_FORK_RUN" = "true" ]; then
                next_file='ci_fork_mkosi.yml'
                callee_inputs=$(jq -n --arg reason "ci after fetch-fedora-bootc-manifest" '{reason: $reason}')
              elif [ "$CI_TEST_RUN" = "true" ]; then
                next_file='ci_test_rootless-docker.yml'
              else
                next_file='ci_firmware-rk.yml'
                callee_inputs=$(jq -n --arg reason "ci after fetch-fedora-bootc-manifest" --arg push "$FIRMWARE_DOCKER_PUSH" '{reason: $reason, Docker_push: $push}')
              fi
              ;;
            ci_fork_mkosi)
              next_file='ci_fork_bcvk.yml'
              callee_inputs=$(jq -n --arg reason "ci after ci_fork_mkosi" '{reason: $reason}')
              ;;
            ci_fork_bcvk)
              next_file='ci_fork_arm-trusted-firmware.yml'
              callee_inputs=$(jq -n --arg reason "ci after ci_fork_bcvk" '{reason: $reason}')
              ;;
            ci_fork_arm-trusted-firmware)
              next_file='ci_fork_optee-os.yml'
              callee_inputs=$(jq -n --arg reason "ci after ci_fork_arm-trusted-firmware" '{reason: $reason}')
              ;;
            ci_fork_optee_os)
              next_file='ci_fork_ms-tpm-20-ref.yml'
              callee_inputs=$(jq -n --arg reason "ci after ci_fork_optee_os" '{reason: $reason}')
              ;;
            ci_fork_ms-tpm-20-ref)
              next_file='ci_fork_optee-ftpm.yml'
              callee_inputs=$(jq -n --arg reason "ci after ci_fork_ms-tpm-20-ref" '{reason: $reason}')
              ;;
            ci_fork_optee_ftpm)
              next_file='ci_fork_u-boot.yml'
              callee_inputs=$(jq -n --arg reason "ci after ci_fork_optee_ftpm" '{reason: $reason}')
              ;;
            ci_fork_u-boot)
              next_file='ci_fork_edk2.yml'
              callee_inputs=$(jq -n --arg reason "ci after ci_fork_u-boot" '{reason: $reason}')
              ;;
            ci_fork_edk2)
              if [ "$CI_TEST_RUN" = "true" ]; then
                next_file='ci_test_rootless-docker.yml'
              else
                next_file='ci_firmware-rk.yml'
                callee_inputs=$(jq -n --arg reason "ci after ci_fork_edk2" --arg push "$FIRMWARE_DOCKER_PUSH" '{reason: $reason, Docker_push: $push}')
              fi
              ;;
            'TEST - Rootless Docker bootstrap validation')
              next_file='ci_test_bootc-filesystem.yml'
              ;;
            'TEST - bootc to-filesystem install e2e')
              next_file='ci_test_pq_tls_verify.yml'
              ;;
            'TEST - PQ hybrid TLS verification (ADR-025)')
              next_file='ci_firmware-rk.yml'
              callee_inputs=$(jq -n --arg reason "ci after TEST workflows" --arg push "$FIRMWARE_DOCKER_PUSH" '{reason: $reason, Docker_push: $push}')
              ;;
            'yubiOS RK firmware')
              next_file='yubiOS-ci.yml'
              callee_inputs=$(jq -n --arg push "$DOCKER_PUSH" '{Docker_push: $push}')
              ;;
            'yubiOS CI')
              next_file='ci_dev_image.yml'
              callee_inputs=$(jq -n --arg push "$DEV_DOCKER_PUSH" '{Docker_push: $push}')
              ;;
            'yubiOS dev/test image (swu2f, ADR-026)')
              next_file='ci_mkosi-installer.yml'
              callee_inputs=$(jq -n --arg reason "ci after yubiOS dev/test image" --arg push "$INSTALLER_DOCKER_PUSH" '{reason: $reason, Docker_push: $push}')
              ;;
            'yubiOS mkosi-installer')
              if [ "$CI_TEST_RUN" = "true" ]; then
                next_file='ci_test-vm.yml'
                callee_inputs=$(jq -n --arg image "$VM_IMAGE" '{image: $image}')
              else
                echo 'Ordered CI chain complete (TEST workflows disabled).'
                exit 0
              fi
              ;;
            'yubiOS VM e2e (tests/vm)')
              echo 'Ordered CI chain complete.'
              exit 0
              ;;
            *)
              echo "::error::No next workflow configured for state '${STATE}'."
              exit 1
              ;;
          esac

          common_inputs=$(jq -n \
            --arg ci_callback 'true' \
            --arg ci_chain_ref "$REF" \
            --arg ci_reason "$REASON" \
            --arg ci_Docker_push "$DOCKER_PUSH" \
            --arg ci_Dev_Docker_push "$DEV_DOCKER_PUSH" \
            --arg ci_Firmware_Docker_push "$FIRMWARE_DOCKER_PUSH" \
            --arg ci_Installer_Docker_push "$INSTALLER_DOCKER_PUSH" \
            --arg ci_fork_run "$CI_FORK_RUN" \
            --arg ci_test_run "$CI_TEST_RUN" \
            --arg ci_vm_image "$VM_IMAGE" \
            '{ci_callback: $ci_callback, ci_chain_ref: $ci_chain_ref, ci_reason: $ci_reason, ci_Docker_push: $ci_Docker_push, ci_Dev_Docker_push: $ci_Dev_Docker_push, ci_Firmware_Docker_push: $ci_Firmware_Docker_push, ci_Installer_Docker_push: $ci_Installer_Docker_push, ci_fork_run: $ci_fork_run, ci_test_run: $ci_test_run, ci_vm_image: $ci_vm_image}')
          inputs_json=$(jq -n --argjson a "$callee_inputs" --argjson b "$common_inputs" '$a + $b')
          payload=$(jq -n --arg ref "$REF" --argjson inputs "$inputs_json" '{ref: $ref, inputs: $inputs}')

          curl -fsS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/actions/workflows/${next_file}/dispatches" \
            -d "$payload"
          echo "Dispatched ${next_file} on ${REF} from state ${STATE}."
