name: apply jq callback fix

on:
  push:
    paths:
      - '.github/workflows/apply-jq-callback-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # PINNED.md

      - name: Replace jq callback expression in workflow files
        run: |
          python3 - <<'PY'
          from pathlib import Path

          old = '''conclusion=$(jq -r 'to_entries | if any(.value.result; . == "failure" or . == "cancelled") then "failure" else "success" end' <<<"$NEEDS_JSON")'''
          new = '''conclusion=$(jq -r 'if any(to_entries[]; .value.result == "failure" or .value.result == "cancelled") then "failure" else "success" end' <<<"$NEEDS_JSON")'''

          changed = []
          for path in sorted(Path('.github/workflows').glob('*.yml')):
              text = path.read_text()
              updated = text.replace(old, new)
              if updated != text:
                  path.write_text(updated)
                  changed.append(str(path))

          for path in changed:
              print(f'updated {path}')
          print(f'updated_count={len(changed)}')
          PY

      - name: Commit workflow fixes and remove one-time helper
        run: |
          set -euo pipefail
          git config user.name "yubiOS CI Coding Agent"
          git config user.email "ci-agent@yubi-os.local"
          git add .github/workflows/*.yml
          git rm --quiet -f .github/workflows/apply-jq-callback-fix.yml
          if git diff --cached --quiet; then
            echo "No workflow changes to commit."
            exit 0
          fi
          git commit -m "ci: apply jq callback parsing fix to workflows"
          git push origin HEAD:main
