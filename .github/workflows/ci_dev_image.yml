name: yubiOS dev/test image (swu2f, ADR-026)

# Builds the swu2f-enabled TEST image (Containerfile.dev, on top of the same
# base as production) and publishes it to docker.io/0mniteck/yubios under the
# `dev` / `dev-<sha>` tags — a distinct namespace from `latest`/`<sha>`, per
# ADR-026 (extends the per-artifact tag scheme from ADR-022).
#
# Purpose: give ci_test-vm.yml's vm-e2e job (bcvk on rock1, self-hosted ARM64)
# a real, pullable yubiOS image so the LUKS2-FIDO2 + systemd-homed + enrollment
# boot legs actually run instead of loud-skipping for lack of an image.
#
# TEST-ONLY: this image ships `passless`, a software FIDO2 authenticator.
# NEVER treat `dev`/`dev-<sha>` as production-equivalent to `latest`. Never
# wire this workflow's output into yubiOS-ci.yml's production push path.
#
# Same rootless-Docker-in-Docker pattern as yubiOS-ci.yml (ADR-014): dind on
# dhi.io's hardened base, per-arch build + push, then a manifest-list merge.

on:
  workflow_dispatch:
    inputs:
      Docker_push:
        default: false
        type: boolean
        required: true
        description: Push dev/test image to Docker Hub (multi-arch manifest)?
      ci_callback:
        description: 'Internal: call back to ci.yml when this workflow finishes.'
        required: false
        default: false
        type: boolean
      ci_chain_ref:
        description: 'Internal: ref carried by the ci.yml orchestrator.'
        required: false
        default: ''
        type: string
      ci_reason:
        description: 'Internal: original ci.yml orchestrator reason.'
        required: false
        default: 'manual'
        type: string
      ci_Docker_push:
        description: 'Internal: production image push flag carried by ci.yml.'
        required: false
        default: false
        type: boolean
      ci_Dev_Docker_push:
        description: 'Internal: dev image push flag carried by ci.yml.'
        required: false
        default: false
        type: boolean
      ci_Firmware_Docker_push:
        description: 'Internal: firmware artifact push flag carried by ci.yml.'
        required: false
        default: false
        type: boolean
      ci_Installer_Docker_push:
        description: 'Internal: installer artifact push flag carried by ci.yml.'
        required: false
        default: false
        type: boolean
      ci_vm_image:
        description: 'Internal: VM image ref carried by ci.yml.'
        required: false
        default: 'docker.io/0mniteck/yubios:dev'
        type: string

permissions:
  contents: read
  actions: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            docker_arch: x86_64
            buildx_arch: linux-amd64
          - arch: arm64
            runner: [self-hosted, Linux, ARM64, GPU]
            docker_arch: aarch64
            buildx_arch: linux-arm64
    runs-on: ${{ matrix.runner }}
    container:
      options: --privileged
      volumes:
        - /mnt:/mnt
      credentials:
        username: 0mniteck42
        password: ${{ secrets.DOCKER }}
      image: docker://dhi.io/debian-base@sha256:ce12bf580bb4c3986b7c934db5948353646371326c038a506dbe19545a1e0ee7 # auto-resolves to ${{ matrix.arch }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install docker-engine and docker-buildx (${{ matrix.arch }})
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git wget iptables nftables
          wget -q "https://download.docker.com/linux/static/stable/${{ matrix.docker_arch }}/docker-29.6.0.tgz"
          wget -q "https://github.com/docker/buildx/releases/download/v0.35.0/buildx-v0.35.0.${{ matrix.buildx_arch }}"
          tar xzf docker-29.6.0.tgz
          mkdir -p /usr/libexec/docker/cli-plugins/
          cp docker/* /usr/bin/
          cp "buildx-v0.35.0.${{ matrix.buildx_arch }}" /usr/libexec/docker/cli-plugins/docker-buildx
          chmod +x /usr/libexec/docker/cli-plugins/docker-buildx
          mkdir -p /mnt/docker
          dockerd --storage-driver=overlayfs --data-root=/mnt/docker -H unix:///var/run/ducker.sock &
          for i in $(seq 1 30); do docker -H unix:///var/run/ducker.sock info >/dev/null 2>&1 && break; sleep 1; done
          docker -H unix:///var/run/ducker.sock buildx create --name hardened \
            --driver docker-container \
            --use

      - name: Log in to Docker Hub
        if: github.event_name == 'workflow_dispatch' && inputs.Docker_push == true
        run: echo "${{ secrets.DOCKER }}" | docker -H unix:///var/run/ducker.sock login -u 0mniteck42 --password-stdin

      - name: Build base yubiOS image (production Containerfile, local tag)
        run: |
          docker -H unix:///var/run/ducker.sock buildx build -f Containerfile \
            --policy reset=true,strict=true,filename=yubiOS.rego \
            --platform linux/${{ matrix.arch }} \
            --load \
            -t "yubios:base-${{ matrix.arch }}" \
            .

      - name: Build dev/test image on top of it (Containerfile.dev, swu2f)
        # Classic (non-buildx) docker build: the docker-container buildx driver runs an
        # isolated BuildKit instance that can't resolve a local-only FROM tag (it tried
        # to pull yubios:base-${{ matrix.arch }} from Docker Hub and got insufficient_scope).
        # Plain `docker build` reads the daemon's own local image store directly, so it
        # sees the base image --load just placed there.
        run: |
          docker -H unix:///var/run/ducker.sock build -f Containerfile.dev \
            --build-arg BASE_IMAGE="yubios:base-${{ matrix.arch }}" \
            -t "yubios:dev-${{ matrix.arch }}" \
            .

      - name: Verify passless is present (real regression gate)
        run: |
          docker -H unix:///var/run/ducker.sock run --rm "yubios:dev-${{ matrix.arch }}" \
            sh -c 'command -v passless && passless --version' || \
            { echo "::error::passless not found in dev image — swu2f layer 2 missing"; exit 1; }

      - name: Push per-arch dev image (${{ matrix.arch }})
        if: github.event_name == 'workflow_dispatch' && inputs.Docker_push == true
        env:
          DEV_ARCH_TAG: 0mniteck/yubios:dev-${{ github.sha }}-${{ matrix.arch }}
        # Tag the already-built local image and push with the classic client -- no need
        # for buildx here, this is a single-arch image already resolved above.
        run: |
          set -euo pipefail
          case "$DEV_ARCH_TAG" in
            0mniteck/yubios:dev-*-amd64|0mniteck/yubios:dev-*-arm64) ;;
            *)
              echo "::error::dev/test per-arch publish attempted non-dev tag: $DEV_ARCH_TAG"
              exit 1
              ;;
          esac
          docker -H unix:///var/run/ducker.sock tag "yubios:dev-${{ matrix.arch }}" "$DEV_ARCH_TAG"
          docker -H unix:///var/run/ducker.sock push "$DEV_ARCH_TAG"

  merge-manifest:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.Docker_push == true
    runs-on: ubuntu-24.04
    env:
      DEV_SHA_TAG: 0mniteck/yubios:dev-${{ github.sha }}
      DEV_FLOATING_TAG: 0mniteck/yubios:dev
    container:
      options: --privileged
      volumes:
        - /mnt:/mnt
      credentials:
        username: 0mniteck42
        password: ${{ secrets.DOCKER }}
      image: docker://dhi.io/debian-base@sha256:ce12bf580bb4c3986b7c934db5948353646371326c038a506dbe19545a1e0ee7
    steps:
      - name: Install docker CLI + buildx
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git wget iptables nftables
          wget -q "https://download.docker.com/linux/static/stable/x86_64/docker-29.6.0.tgz"
          wget -q "https://github.com/docker/buildx/releases/download/v0.35.0/buildx-v0.35.0.linux-amd64"
          tar xzf docker-29.6.0.tgz
          mkdir -p /usr/libexec/docker/cli-plugins/
          cp docker/* /usr/bin/
          cp buildx-v0.35.0.linux-amd64 /usr/libexec/docker/cli-plugins/docker-buildx
          chmod +x /usr/libexec/docker/cli-plugins/docker-buildx
          mkdir -p /mnt/docker
          dockerd --storage-driver=overlayfs --data-root=/mnt/docker -H unix:///var/run/ducker.sock &
          for i in $(seq 1 30); do docker -H unix:///var/run/ducker.sock info >/dev/null 2>&1 && break; sleep 1; done
          docker -H unix:///var/run/ducker.sock buildx create --name hardened \
            --driver docker-container \
            --use

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER }}" | docker -H unix:///var/run/ducker.sock login -u 0mniteck42 --password-stdin

      - name: Guard dev/test manifest tags
        run: |
          set -euo pipefail
          for tag in "$DEV_SHA_TAG" "$DEV_FLOATING_TAG"; do
            case "$tag" in
              0mniteck/yubios:dev|0mniteck/yubios:dev-*) ;;
              *)
                echo "::error::dev/test publish attempted non-dev tag: $tag"
                exit 1
                ;;
            esac
          done

      - name: Create + push multi-arch dev manifest
        run: |
          docker -H unix:///var/run/ducker.sock buildx imagetools create \
            -t "$DEV_SHA_TAG" \
            -t "$DEV_FLOATING_TAG" \
            "0mniteck/yubios:dev-${{ github.sha }}-amd64" \
            "0mniteck/yubios:dev-${{ github.sha }}-arm64"

      - name: Verify manifest list
        run: docker -H unix:///var/run/ducker.sock buildx imagetools inspect "$DEV_SHA_TAG"

  ci-callback:
    name: Callback to ci.yml orchestrator
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.ci_callback == true }}
    needs: [build, merge-manifest]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    steps:
      - name: Report current state to ci.yml
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WORKFLOW_NAME: ${{ github.workflow }}
          REF: ${{ inputs.ci_chain_ref != '' && inputs.ci_chain_ref || github.ref_name }}
          NEEDS_JSON: ${{ toJSON(needs) }}
          CI_REASON: ${{ inputs.ci_reason }}
          CI_DOCKER_PUSH: ${{ inputs.ci_Docker_push }}
          CI_DEV_DOCKER_PUSH: ${{ inputs.ci_Dev_Docker_push }}
          CI_FIRMWARE_DOCKER_PUSH: ${{ inputs.ci_Firmware_Docker_push }}
          CI_INSTALLER_DOCKER_PUSH: ${{ inputs.ci_Installer_Docker_push }}
          CI_VM_IMAGE: ${{ inputs.ci_vm_image }}
        run: |
          set -euo pipefail
          conclusion=$(jq -r 'if any(to_entries[]; .value.result == "failure" or .value.result == "cancelled") then "failure" else "success" end' <<<"$NEEDS_JSON")
          payload=$(jq -n \
            --arg ref "$REF" \
            --arg state "$WORKFLOW_NAME" \
            --arg completed_conclusion "$conclusion" \
            --arg reason "$CI_REASON" \
            --arg Docker_push "$CI_DOCKER_PUSH" \
            --arg Dev_Docker_push "$CI_DEV_DOCKER_PUSH" \
            --arg Firmware_Docker_push "$CI_FIRMWARE_DOCKER_PUSH" \
            --arg Installer_Docker_push "$CI_INSTALLER_DOCKER_PUSH" \
            --arg vm_image "$CI_VM_IMAGE" \
            '{ref: $ref, inputs: {state: $state, completed_conclusion: $completed_conclusion, reason: $reason, target_ref: $ref, Docker_push: $Docker_push, Dev_Docker_push: $Dev_Docker_push, Firmware_Docker_push: $Firmware_Docker_push, Installer_Docker_push: $Installer_Docker_push, vm_image: $vm_image}}')
          curl -fsS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/actions/workflows/ci.yml/dispatches" \
            -d "$payload"
          echo "Reported ${WORKFLOW_NAME} as ${conclusion} to ci.yml."
