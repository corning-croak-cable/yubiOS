name: ci_int_matrix

# yubiOS INT DIAGNOSTIC MATRIX (2026-07-07) — temporary lane, delete when INT is green.
#
# WHY THIS EXISTS (advanced-reasoning root-cause pass after run 28889684904):
# The INT e2e "silent stall" is NOT one bug — the three failing assertions have
# three independent candidate causes, so we test them as a PARALLEL BATCH
# instead of one-fix-per-run:
#
#   A1 "fTPM Early TA not at init"  -> early_ta_init is a DMSG; default
#       CFG_TEE_CORE_LOG_LEVEL hides it. Hypothesis: TA is embedded fine,
#       the assertion greps for a suppressed debug line. Fix: log level 3.
#   A2 "fTPM TA never probed"      -> nothing opens the TA anymore. The old
#       ldelf crash came from autoboot's `bootefi bootmgr` EFI init (MM-comm,
#       now disabled). With no kernel/ESP U-Boot just idles 180s; the TPM is
#       never touched. Fix: force CONFIG_BOOTCOMMAND to exercise it.
#   A3 "no measured-boot event log" -> TCG2 event log only exists when the
#       EFI path actually runs. Same fix as A2 via bootefi.
#   A4 (lurking) storage: with CFG_RPMB_FS=n CFG_REE_FS=n OP-TEE has NO secure
#       storage; the fTPM TA may fail NV commit when probed. v5 compares RPMB=y.
#
# All variants: OP-TEE debug log level + FULL serial dumps (the INT harness
# only showed head -20 of a 107-line nw.log — we have never seen U-Boot's output).
# amd64 only: both arches failed byte-identically, so arm64 adds cost, not info.
# Jobs never fail on assertions — this is evidence collection; read the
# "MATRIX RESULT" block in each job.

on:
  push:
    branches: [main]
    paths: ['.github/workflows/ci_int_matrix.yml']
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why are you running this manually?'
        required: false
        default: 'manual'

permissions:
  contents: read

env:
  TFA_REF: f9e106415eb569ff9b19404e2c3f64167af08d21
  OPTEE_OS_REF: cc1847276821220facbffec13812c1888b44e6cb
  OPTEE_FTPM_REF: 28abbe7f33a96302cccf07b86b9ea46cf3dc278f
  UBOOT_REF: ef2ab32418943c161d0889af24375a52b14e10f9
  MS_TPM_REF: 98b60a44aba79b15fcce1c0d1e46cf5918400f6a
  FTPM_UUID: bc50d971-d4c9-42c4-82cb-343fb7f37896
  OPTEE_PLATFORM: vexpress-qemu_armv8a
  MBEDTLS_REF: mbedtls-3.6.6
  BOOT_TIMEOUT: '150'

jobs:
  variant:
    name: ${{ matrix.variant }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: x1-volatile-full
            storage: 'CFG_RPMB_FS=n CFG_REE_FS=n'
            bootcmd: 'tpm2 init; tpm2 startup TPM2_SU_CLEAR; tpm2 self_test full; bootefi bootmgr'
          - variant: x2-volatile-tpmonly
            storage: 'CFG_RPMB_FS=n CFG_REE_FS=n'
            bootcmd: 'tpm2 init; tpm2 startup TPM2_SU_CLEAR; tpm2 pcr_read sha256 0'
    steps:
      - name: Install toolchain + QEMU
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf \
            python3 python3-venv python3-dev python3-pyelftools \
            python3-cryptography python3-setuptools \
            device-tree-compiler openssl libssl-dev libgnutls28-dev \
            bison flex bc uuid-dev swig git ca-certificates \
            qemu-system-arm qemu-utils ipxe-qemu

      - name: Build U-Boot BL33 (variant bootcmd)
        run: |
          set -euxo pipefail
          git clone --no-tags https://github.com/yubi-OS/u-boot u-boot
          git -C u-boot checkout "$UBOOT_REF"
          cat > u-boot/yubios_ftpm.config <<'EOF'
          CONFIG_TEE=y
          CONFIG_OPTEE=y
          CONFIG_TPM=y
          CONFIG_TPM_V2=y
          CONFIG_TPM2_FTPM_TEE=y
          CONFIG_CMD_TPM=y
          CONFIG_EFI_LOADER=y
          # CONFIG_EFI_MM_COMM_TEE is not set
          CONFIG_EFI_TCG2_PROTOCOL=y
          CONFIG_HASH=y
          CONFIG_MEASURED_BOOT=y
          CONFIG_BOOTDELAY=1
          # CONFIG_UNIT_TEST is not set
          EOF
          if [ -n "${{ matrix.bootcmd }}" ]; then
            printf 'CONFIG_BOOTCOMMAND="%s"\n' '${{ matrix.bootcmd }}' >> u-boot/yubios_ftpm.config
          fi
          cat u-boot/yubios_ftpm.config
          make -C u-boot CROSS_COMPILE=aarch64-linux-gnu- ARCH=arm qemu_arm64_defconfig
          ./u-boot/scripts/kconfig/merge_config.sh -m -O u-boot u-boot/.config u-boot/yubios_ftpm.config
          make -C u-boot CROSS_COMPILE=aarch64-linux-gnu- ARCH=arm olddefconfig
          grep -E 'CONFIG_BOOTCOMMAND|CONFIG_CMD_TPM|CONFIG_TPM2_FTPM_TEE|CONFIG_EFI_MM_COMM_TEE|CONFIG_EFI_TCG2' u-boot/.config || true
          make -C u-boot -j"$(nproc)" CROSS_COMPILE=aarch64-linux-gnu- ARCH=arm
          test -f u-boot/u-boot.bin
          echo "BL33_BIN=$GITHUB_WORKSPACE/u-boot/u-boot.bin" >> "$GITHUB_ENV"

      - name: OP-TEE pass 1 — TA dev kit
        run: |
          set -euxo pipefail
          git clone --no-tags https://github.com/yubi-OS/optee_os optee_os
          git -C optee_os checkout "$OPTEE_OS_REF"
          make -C optee_os -j"$(nproc)" \
            PLATFORM="$OPTEE_PLATFORM" \
            CROSS_COMPILE64=aarch64-linux-gnu- \
            CROSS_COMPILE=arm-linux-gnueabihf- \
            ${{ matrix.storage }} CFG_EARLY_TA=y \
            CFG_TEE_CORE_LOG_LEVEL=3 CFG_TEE_TA_LOG_LEVEL=3 \
            ta_dev_kit
          devkit=$(find "$GITHUB_WORKSPACE/optee_os/out" -type d -name 'export-ta_arm64' -print -quit)
          test -f "$devkit/mk/ta_dev_kit.mk"
          echo "TA_DEV_KIT_DIR=$devkit" >> "$GITHUB_ENV"

      - name: Build fTPM TA
        run: |
          set -euxo pipefail
          git clone --no-tags https://github.com/yubi-OS/optee_ftpm optee_ftpm
          git -C optee_ftpm checkout "$OPTEE_FTPM_REF"
          git clone --no-tags https://github.com/yubi-OS/ms-tpm-20-ref ms-tpm-20-ref
          git -C ms-tpm-20-ref checkout "$MS_TPM_REF"
          # ROOT-CAUSE FIX (matrix round 2): the fTPM TA declares
          # TA_FLAG_DEVICE_ENUM_TEE_STORAGE_PRIVATE — "enumerate me on the TEE
          # bus only once TEE-private secure storage (RPMB) is up". U-Boot's
          # device.pta scan requests plain TA_FLAG_DEVICE_ENUM, so the fTPM is
          # invisible: no udevice bound, `tpm2 init` -> "Couldn't set TPM 0",
          # TCG2 -> "Missing TPMv2 device". Proven by matrix run 28891652716
          # (device.pta opened + returned empty in all 5 variants).
          # Patch the flag to plain TA_FLAG_DEVICE_ENUM for this test lane.
          sed -i 's/TA_FLAG_DEVICE_ENUM_TEE_STORAGE_PRIVATE/TA_FLAG_DEVICE_ENUM/' \
            optee_ftpm/include/user_ta_header_defines.h
          grep -n 'TA_FLAG_DEVICE_ENUM' optee_ftpm/include/user_ta_header_defines.h
          # ROOT-CAUSE FIX (matrix round 3): with the TA now enumerable, U-Boot
          # opens it and the TA panics with 0xffff0009 inside
          # TEE_OpenPersistentObject — GP spec makes libutee TEE_Panic on any
          # non-listed return code, and a storage-less OP-TEE core (or a
          # supplicant with no RPMB, i.e. U-Boot on QEMU virt) returns
          # TEE_ERROR_NOT_IMPLEMENTED, which is not in the allowed list. No
          # TA-side error handling can catch a libutee panic, so in this CI
          # environment the TA must never issue storage syscalls at all.
          # Insert a volatile-NV mode (guarded by TA_FTPM_VOLATILE_NV): NV state
          # lives in RAM, manufactured fresh each boot, write-back is a no-op.
          # Real hardware keeps RPMB-backed NV; this define is CI-only.
          python3 - <<'PYEOF'
          import re
          p = 'optee_ftpm/platform/NVMem.c'
          src = open(p).read()
          anchor1 = '''\tif (s_NVInitialized) {
          \t\treturn;
          \t}'''.replace('          ','')
          block1 = anchor1 + '''
          #ifdef TA_FTPM_VOLATILE_NV
          \t// CI-only volatile NV: no storage backend exists (bare QEMU + U-Boot
          \t// supplicant without RPMB). Any storage syscall would TEE_Panic via
          \t// libutee (GP spec) with TEE_ERROR_NOT_IMPLEMENTED. Manufacture fresh
          \t// RAM-only state instead and never touch TEE storage.
          \ts_NVChipFileNeedsManufacture = TRUE;
          \ts_blockMap = 0;
          \ts_NVInitialized = FALSE;
          \treturn;
          #endif'''.replace('          ','')
          assert src.count(anchor1) == 1, 'anchor1 not unique'
          src = src.replace(anchor1, block1, 1)
          anchor2 = '''\tif ((!s_blockMap) || (!s_NVInitialized)) {
          \t\treturn;
          \t}'''.replace('          ','')
          block2 = '''#ifdef TA_FTPM_VOLATILE_NV
          \t// CI-only volatile NV: drop write-back entirely.
          \ts_blockMap = 0;
          \treturn;
          #endif
          ''' .replace('          ','') + anchor2
          assert src.count(anchor2) == 1, 'anchor2 not unique'
          src = src.replace(anchor2, block2, 1)
          open(p,'w').write(src)
          print('NVMem.c volatile-NV patch applied')
          PYEOF
          printf '\ncppflags-y += -DTA_FTPM_VOLATILE_NV=1\n' >> optee_ftpm/sub.mk
          tail -3 optee_ftpm/sub.mk
          make -C optee_ftpm -j"$(nproc)" \
            TA_DEV_KIT_DIR="$TA_DEV_KIT_DIR" \
            CFG_MS_TPM_20_REF="$GITHUB_WORKSPACE/ms-tpm-20-ref" \
            CROSS_COMPILE_ta_arm64=aarch64-linux-gnu- \
            CFG_ARM64_ta_arm64=y
          stripped=$(find optee_ftpm -name "${FTPM_UUID}.stripped.elf" -print -quit)
          test -n "$stripped"
          echo "FTPM_TA=$GITHUB_WORKSPACE/$stripped" >> "$GITHUB_ENV"

      - name: OP-TEE pass 2 — final BL32 (fTPM Early TA, debug logs)
        run: |
          set -euxo pipefail
          make -C optee_os -j"$(nproc)" \
            PLATFORM="$OPTEE_PLATFORM" \
            CROSS_COMPILE64=aarch64-linux-gnu- \
            CROSS_COMPILE=arm-linux-gnueabihf- \
            ${{ matrix.storage }} \
            CFG_EARLY_TA=y EARLY_TA_PATHS="$FTPM_TA" \
            CFG_CORE_DYN_SHM=y \
            CFG_TEE_CORE_LOG_LEVEL=3 CFG_TEE_TA_LOG_LEVEL=3 \
            all
          h=$(find optee_os/out -name tee-header_v2.bin -print -quit)
          p=$(find optee_os/out -name tee-pager_v2.bin -print -quit)
          x=$(find optee_os/out -name tee-pageable_v2.bin -print -quit)
          test -n "$h" && test -n "$p" && test -n "$x"
          echo "BL32_HDR=$GITHUB_WORKSPACE/$h"   >> "$GITHUB_ENV"
          echo "BL32_PAGER=$GITHUB_WORKSPACE/$p" >> "$GITHUB_ENV"
          echo "BL32_PAGEABLE=$GITHUB_WORKSPACE/$x" >> "$GITHUB_ENV"

      - name: TF-A FIP
        run: |
          set -euxo pipefail
          git clone --no-tags https://github.com/yubi-OS/arm-trusted-firmware arm-trusted-firmware
          git -C arm-trusted-firmware checkout "$TFA_REF"
          git clone --no-tags --branch "$MBEDTLS_REF" https://github.com/Mbed-TLS/mbedtls mbedtls
          make -C arm-trusted-firmware -j"$(nproc)" \
            CROSS_COMPILE=aarch64-linux-gnu- \
            PLAT=qemu ARCH=aarch64 \
            SPD=opteed \
            BL32="$BL32_HDR" BL32_EXTRA1="$BL32_PAGER" BL32_EXTRA2="$BL32_PAGEABLE" \
            BL32_RAM_LOCATION=tdram \
            BL33="$BL33_BIN" \
            TRUSTED_BOARD_BOOT=1 GENERATE_COT=1 CREATE_KEYS=1 \
            MBEDTLS_DIR="$GITHUB_WORKSPACE/mbedtls" \
            DEBUG=1 \
            all fip
          bl1=$(find arm-trusted-firmware/build -name bl1.bin -print -quit)
          fip=$(find arm-trusted-firmware/build -name fip.bin -print -quit)
          test -n "$bl1" && test -n "$fip"
          dd if="$bl1" of=flash.bin bs=4096 conv=notrunc
          dd if="$fip" of=flash.bin seek=64 bs=4096 conv=notrunc
          ls -l flash.bin

      - name: QEMU boot + FULL evidence dump
        run: |
          set -uxo pipefail
          timeout "$BOOT_TIMEOUT" qemu-system-aarch64 \
            -M virt,secure=on -cpu max -m 2048 \
            -bios flash.bin \
            -nographic -d guest_errors \
            -serial file:nw.log -serial file:optee.log || true
          touch nw.log optee.log
          echo "=================== FULL nw.log (normal world / U-Boot) ==================="
          wc -l nw.log
          sed -n '1,400p' nw.log
          echo "=================== FULL optee.log (secure world) ==================="
          wc -l optee.log
          sed -n '1,400p' optee.log
          echo "=================== MATRIX RESULT ${{ matrix.variant }} ==================="
          r() { grep -Eiq "$2" nw.log optee.log && echo "$1=PASS" || echo "$1=FAIL"; }
          r A1_early_ta_registered "early_ta_init.*${FTPM_UUID}|Early TA ${FTPM_UUID}"
          r A2_ftpm_probed "ldelf.*${FTPM_UUID}|Loading TS ${FTPM_UUID}|Lookup user TA ELF ${FTPM_UUID}"
          r A3_event_log "event log|EventLog|measured boot|TCG2|TPM event log|sml-base"
          echo "--- A4 errors/panics/aborts observed: ---"
          grep -Ei "E/TC|E/LD|panic|abort|data-abort|assert" nw.log optee.log || echo "(none)"
          echo "=================== END MATRIX RESULT ==================="
