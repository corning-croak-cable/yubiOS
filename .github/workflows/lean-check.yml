name: lean-check

on:
  push:
    branches: ['main', 'lean-check-*']
    paths:
      - 'papers/data/lean/**'
      - 'tools/**'
      - '.github/workflows/lean-check.yml'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why this check is being run'
        required: false
        default: 'manual lean check'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install elan (Lean 4.33.0, pinned)
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Lean version
        run: lean --version

      - name: Check CurvedCorpus.lean
        run: |
          lean papers/data/lean/CurvedCorpus.lean
          echo "LEAN_OK: all theorems in papers/data/lean/CurvedCorpus.lean check with no sorry"

      - name: Assert no sorry
        run: |
          ! grep -n "sorry" papers/data/lean/CurvedCorpus.lean
          echo "NO_SORRY_OK"

  verify-measurements:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install numpy
        run: python3 -m pip install --quiet numpy

      - name: Resolve measurement-side claims
        run: python3 papers/data/lean/verify_claims.py

  verify-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install numpy
        run: python3 -m pip install --quiet numpy

      - name: corpus-auditor selftest
        run: python3 tools/corpus-auditor/auditor.py --selftest

      - name: rsi-descent selftest
        run: python3 tools/rsi-descent/rsi_descent.py --selftest

      - name: boltzmann-collapse selftest
        run: python3 tools/boltzmann-collapse/collapse.py --selftest

      - name: spectral-defocus selftest
        run: python3 tools/spectral-defocus/defocus.py --selftest

      - name: spectral-defocus atomicity admission + de-atomization
        run: python3 tools/spectral-defocus/defocus.py --admit-null

      - name: injective-mapping selftest
        run: python3 tools/injective-mapping/mapping.py --selftest
