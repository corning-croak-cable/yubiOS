name: ci_dispatch-reachability
on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'scripts/assert-dispatch-reachable.py'
  schedule:
    # Weekly Monday 9 AM UTC drift scan on main
    - cron: '0 9 * * 1'
  workflow_dispatch:
    inputs:
      fail_on:
        type: choice
        description: 'Exit non-zero threshold'
        options:
          - ERROR
          - WARN
          - NEVER
        default: ERROR

permissions:
  contents: read

jobs:
  assert:
    name: Assert workflow_dispatch reachability
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Run reachability assert
        run: |
          python3 scripts/assert-dispatch-reachable.py \
            --repo-root . \
            --ci-yml .github/workflows/ci.yml \
            --output-format json \
            --fail-on "${{ inputs.fail_on || 'ERROR' }}" \
            > reachability-report.json

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4.6.0
        with:
          name: dispatch-reachability-report-${{ github.run_id }}
          path: reachability-report.json
          retention-days: 30
