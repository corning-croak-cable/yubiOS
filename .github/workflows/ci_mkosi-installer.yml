name: yubiOS mkosi-installer

# yubiOS mkosi disk-image build + installer publish (#10, ADR-022).
#
# Builds the full DPS-partitioned disk image + UKI from the repo's mkosi.conf
# (minimal profile) with Secure Boot signing driven through PKCS#11 — a SoftHSM
# token stands in for YubiKey PIV slot 9c, exercising the exact
# SecureBootKeySource=provider:pkcs11 + systemd-sbsign path the yubiOS profile
# (yubi-OS/mkosi#2) uses on real hardware. The signed UKI is verified against
# the mock cert with sbverify before anything is published.
#
# HSM plumbing: mkosi's signing/validation sandbox does NOT carry sandbox
# trees, but it bind-mounts host /run rw whenever the key source is not a
# file (mkosi's designed path for host HSM daemons like pcscd). So the
# SoftHSM conf + token store live at /run/yubios-hsm — the same absolute
# path on the host (where the token is created) and inside the sandbox
# (where systemd-sbsign signs through pkcs11-provider). The provider is
# pointed straight at libsofthsm2.so via PKCS11_PROVIDER_MODULE, skipping
# p11-kit indirection. Debug trail from the campaign: C_Initialize error 5
# = softhsm can't read SOFTHSM2_CONF inside the sandbox.
#
# A push caused by this workflow file's self-trigger validates the mkosi path
# without publishing. A dispatch with Docker_push=true publishes artifacts as
# 0mniteck/yubios:installer + installer-<sha> per ADR-022 — the same
# one-repo/per-artifact-tag scheme as the firmware bundle.
#
# The mkosi build stays on a bare runner because it needs userns/uidmap plumbing
# and a writable /run. OCI publication is handed to a separate hardened DHI
# container so Docker and the named Buildx builder share one user scope.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ci_mkosi-installer.yml' # self-change trigger for validating workflow edits
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why are you running this manually?'
        required: false
        default: 'manual'
      Docker_push:
        description: 'Push installer image to Docker Hub (0mniteck/yubios:installer)?'
        type: boolean
        required: false
        default: false
      ci_callback:
        description: 'Internal: call back to ci.yml when this workflow finishes.'
        required: false
        default: false
        type: boolean
      ci_chain_ref:
        description: 'Internal: ref carried by the ci.yml orchestrator.'
        required: false
        default: ''
        type: string
      ci_reason:
        description: 'Internal: original ci.yml orchestrator reason.'
        required: false
        default: 'manual'
        type: string
      ci_Docker_push:
        description: 'Internal: production image push flag carried by ci.yml.'
        required: false
        default: false
        type: boolean
      ci_Dev_Docker_push:
        description: 'Internal: dev image push flag carried by ci.yml.'
        required: false
        default: false
        type: boolean
      ci_Firmware_Docker_push:
        description: 'Internal: firmware artifact push flag carried by ci.yml.'
        required: false
        default: false
        type: boolean
      ci_Installer_Docker_push:
        description: 'Internal: installer artifact push flag carried by ci.yml.'
        required: false
        default: false
        type: boolean
      ci_vm_image:
        description: 'Internal: VM image ref carried by ci.yml.'
        required: false
        default: 'docker.io/0mniteck/yubios:dev'
        type: string

permissions:
  contents: read
  actions: write

jobs:
  build:
    name: mkosi disk image — SoftHSM PKCS#11 signed UKI
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0 (PINNED.md)

      - name: Install host deps + mkosi (yubi-OS fork @ main)
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq softhsm2 sbsigntool zstd uidmap python3-pip debian-archive-keyring
          sudo pip install --break-system-packages git+https://github.com/yubi-OS/mkosi.git@feature/yubiOS-profile
          mkosi --version
          # ubuntu 24.04 restricts unprivileged userns via AppArmor; mkosi's
          # sandbox needs it. Harmless if already 0.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: SoftHSM token in /run — mock of YubiKey PIV slot 9c
        run: |
          set -euxo pipefail
          # /run is bind-mounted into mkosi's signing sandbox at the same
          # absolute path, so conf + tokens created here are reachable by
          # systemd-sbsign inside the tools tree without any overlay tricks.
          sudo mkdir -p /run/yubios-hsm/tokens
          openssl req -x509 -newkey rsa:3072 -sha256 -days 365 -nodes \
            -subj "/CN=yubiOS CI Secure Boot (SoftHSM mock of PIV 9c)/" \
            -keyout sb.key -out mkosi.secure-boot.pem
          openssl pkcs8 -topk8 -nocrypt -in sb.key -out sb.p8
          printf 'directories.tokendir = /run/yubios-hsm/tokens\nobjectstore.backend = file\n' \
            | sudo tee /run/yubios-hsm/softhsm2.conf
          sudo SOFTHSM2_CONF=/run/yubios-hsm/softhsm2.conf \
            softhsm2-util --init-token --free --label yubios-9c --pin 123456 --so-pin 123456
          sudo SOFTHSM2_CONF=/run/yubios-hsm/softhsm2.conf \
            softhsm2-util --import sb.p8 --token yubios-9c --label piv-9c --id 9c --pin 123456
          shred -u sb.key sb.p8
          sudo chmod -R a+rwX /run/yubios-hsm
          printf 'pkcs11:token=yubios-9c;object=piv-9c;type=private?pin-value=123456' \
            > mkosi.secure-boot.pkcs11-uri

      - name: Build disk image (minimal profile, PKCS#11-signed UKI)
        run: |
          set -euxo pipefail
          sudo mkosi \
            --distribution fedora \
            --release 45 \
            --profile minimal \
            --package kernel \
            --package systemd-boot-unsigned \
            --bootable yes \
            --tools-tree-package softhsm2 \
            --tools-tree-package pkcs11-provider \
            --tools-tree-package distribution-gpg-keys \
            --tools-tree-package dnf \
            --tools-tree-package rpm \
            --environment PKCS11_PROVIDER_MODULE=/usr/lib/softhsm/libsofthsm2.so \
            --environment SOFTHSM2_CONF=/run/yubios-hsm/softhsm2.conf \
            --environment PKCS11_PROVIDER_DEBUG=file:/dev/stderr,level:1 \
            --secure-boot-key-source provider:pkcs11 \
            --secure-boot-key "$(cat mkosi.secure-boot.pkcs11-uri)" \
            --secure-boot-certificate mkosi.secure-boot.pem \
            --secure-boot-sign-tool systemd-sbsign \
            --sign-expected-pcr-key-source provider:pkcs11 \
            --sign-expected-pcr-key "$(cat mkosi.secure-boot.pkcs11-uri)" \
            --sign-expected-pcr-certificate mkosi.secure-boot.pem \
            build
          ls -la mkosi.output/

      - name: Verify UKI is signed by the PKCS#11 (SoftHSM) key
        run: |
          set -euxo pipefail
          uki=$(find mkosi.output -name '*.efi' -type f -print -quit)
          test -n "$uki"
          sbverify --cert mkosi.secure-boot.pem "$uki"
          echo "PKCS#11 signing path VERIFIED (systemd-sbsign via provider:pkcs11 against SoftHSM)"

      - name: Assemble /installer payload + MANIFEST
        run: |
          set -euxo pipefail
          mkdir -p inst/installer
          # The full disk image is ImageId.raw (yubiOS.raw); *.esp.raw and
          # *.root-*.raw are SplitArtifacts partition splits — don't ship those
          # as the installer payload.
          raw=mkosi.output/yubiOS.raw
          test -s "$raw"
          zstd -T0 -8 --force -o "inst/installer/$(basename "$raw").zst" "$raw"
          find mkosi.output -maxdepth 1 -name '*.efi' -type f -exec cp {} inst/installer/ \;
          find mkosi.output -maxdepth 1 -name '*manifest*' -type f -exec cp {} inst/installer/ \; || true
          cp mkosi.secure-boot.pem inst/installer/ci-secure-boot-cert.pem
          {
            echo "yubiOS mkosi installer image (minimal profile) — CI build"
            echo "yubios_commit=${GITHUB_SHA}"
            echo "workflow_run=${GITHUB_RUN_ID}"
            echo "mkosi_source=https://github.com/yubi-OS/mkosi @ main (yubiOS profile merged via PR #2)"
            echo "signing=UKI signed via SecureBootKeySource=provider:pkcs11 + systemd-sbsign"
            echo "NOTE: CI signing key is a SoftHSM mock of YubiKey PIV slot 9c."
            echo "Production images are signed with the real YubiKey (ADR-008); this"
            echo "image validates the build + PKCS#11 signing path, not a production key."
            echo "Install flow (ADR-022): write this image to disk, boot; the installed"
            echo "system tracks 0mniteck/yubios:latest via bootc. ARM64 targets flash"
            echo "0mniteck/yubios:firmware first (secure world) per ADR-018/019/020."
          } > inst/installer/MANIFEST.txt
          ls -l inst/installer/

      - name: Upload prepared installer payload
        if: github.event_name == 'workflow_dispatch' && inputs.Docker_push == true
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # PINNED.md
        with:
          name: mkosi-installer-payload
          path: inst/installer
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  installer-publish:
    name: Publish installer OCI artifact
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.Docker_push == true
    runs-on: ubuntu-24.04
    container:
      options: --privileged
      volumes:
        - /mnt:/mnt
      credentials:
        username: 0mniteck42
        password: ${{ secrets.DOCKER }}
      image: docker://dhi.io/debian-base@sha256:5c45913e72c90581fc4cca57c3a7cd7dcac2d9fa44fce24fe4cfa342e5ccb7a6
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # PINNED.md

      - name: Download prepared installer payload
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # PINNED.md
        with:
          name: mkosi-installer-payload
          path: inst/installer

      - name: Install docker CLI + buildx
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git curl iptables nftables
          wcurl "https://download.docker.com/linux/static/stable/x86_64/docker-29.6.0.tgz"
          wcurl "https://github.com/docker/buildx/releases/download/v0.35.0/buildx-v0.35.0.linux-amd64"
          tar xzf docker-29.6.0.tgz
          mkdir -p /usr/libexec/docker/cli-plugins/
          cp docker/* /usr/bin/
          cp buildx-v0.35.0.linux-amd64 /usr/libexec/docker/cli-plugins/docker-buildx
          chmod +x /usr/libexec/docker/cli-plugins/docker-buildx
          mkdir -p /mnt/docker
          dockerd --storage-driver=overlayfs --data-root=/mnt/docker -H unix:///var/run/ducker.sock &
          for i in $(seq 1 30); do docker -H unix:///var/run/ducker.sock info >/dev/null 2>&1 && break; sleep 1; done
          docker -H unix:///var/run/ducker.sock buildx create --name hardened \
            --driver docker-container \
            --use

      - name: Build and push installer OCI artifact through Bake
        env:
          GIT_SHA: ${{ github.sha }}
          INSTALLER_CONTEXT: inst
          PUSH: 'true'
        run: |
          set -euxo pipefail
          echo "${{ secrets.DOCKER }}" | docker -H unix:///var/run/ducker.sock login -u 0mniteck42 --password-stdin
          docker -H unix:///var/run/ducker.sock buildx bake \
            --builder hardened \
            --file yubiOS-bake.hcl \
            installer
          docker -H unix:///var/run/ducker.sock logout
          docker -H unix:///var/run/ducker.sock buildx imagetools inspect "0mniteck/yubios:installer"

  ci-callback:
    name: Callback to ci.yml orchestrator
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.ci_callback == true }}
    needs: [build, installer-publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    steps:
      - name: Report current state to ci.yml
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WORKFLOW_NAME: ${{ github.workflow }}
          REF: ${{ inputs.ci_chain_ref != '' && inputs.ci_chain_ref || github.ref_name }}
          NEEDS_JSON: ${{ toJSON(needs) }}
          CI_REASON: ${{ inputs.ci_reason }}
          CI_DOCKER_PUSH: ${{ inputs.ci_Docker_push }}
          CI_DEV_DOCKER_PUSH: ${{ inputs.ci_Dev_Docker_push }}
          CI_FIRMWARE_DOCKER_PUSH: ${{ inputs.ci_Firmware_Docker_push }}
          CI_INSTALLER_DOCKER_PUSH: ${{ inputs.ci_Installer_Docker_push }}
          CI_VM_IMAGE: ${{ inputs.ci_vm_image }}
        run: |
          set -euo pipefail
          conclusion=$(jq -r 'if any(to_entries[]; .value.result == "failure" or .value.result == "cancelled") then "failure" else "success" end' <<<"$NEEDS_JSON")
          payload=$(jq -n \
            --arg ref "$REF" \
            --arg state "$WORKFLOW_NAME" \
            --arg completed_conclusion "$conclusion" \
            --arg reason "$CI_REASON" \
            --arg Docker_push "$CI_DOCKER_PUSH" \
            --arg Dev_Docker_push "$CI_DEV_DOCKER_PUSH" \
            --arg Firmware_Docker_push "$CI_FIRMWARE_DOCKER_PUSH" \
            --arg Installer_Docker_push "$CI_INSTALLER_DOCKER_PUSH" \
            --arg vm_image "$CI_VM_IMAGE" \
            '{ref: $ref, inputs: {state: $state, completed_conclusion: $completed_conclusion, reason: $reason, target_ref: $ref, Docker_push: $Docker_push, Dev_Docker_push: $Dev_Docker_push, Firmware_Docker_push: $Firmware_Docker_push, Installer_Docker_push: $Installer_Docker_push, vm_image: $vm_image}}')
          curl -fsS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/actions/workflows/ci.yml/dispatches" \
            -d "$payload"
          echo "Reported ${WORKFLOW_NAME} as ${conclusion} to ci.yml."
