name: yubiOS CI

# Multi-arch CI: native matrix split across GitHub-hosted amd64 + arm64 runners.
# Strategy 1 from the multi-arch research (native split, NOT QEMU) — every test
# runs on real hardware for each arch, no emulation slowness/flakiness.
# Docker build settings, target dependencies, tags, outputs, and strict
# yubiOS.rego policy wiring live in yubiOS-bake.hcl.
#
# DEPLOY PRE-REQ: the `container.image` below must be the dhi.io/debian-base
# *manifest-list (index)* digest, NOT a single-arch digest. A single-arch (amd64)
# digest will FAIL to pull on ARM64 runners. Run the updated fetch-dhi-manifest
# workflow (it now requests the OCI index media type) to get 5c45913e72c90581fc4cca57c3a7cd7dcac2d9fa44fce24fe4cfa342e5ccb7a6,
# then replace the placeholder below. The index auto-resolves per runner arch.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/yubiOS-ci.yml'
      - 'Containerfile'
      - 'yubiOS-bake.hcl'
      - 'yubiOS.rego'
      - 'usr/**'
      - 'tests/unit/**'
      - 'mkosi.*'
  workflow_dispatch:
    inputs:
      Docker_push:
        default: false
        type: boolean
        required: true
        description: Push to docker hub (multi-arch manifest)?
      ci_callback:
        description: 'Internal: call back to ci.yml when this workflow finishes.'
        required: false
        default: false
        type: boolean
      ci_chain_ref:
        description: 'Internal: ref carried by the ci.yml orchestrator.'
        required: false
        default: ''
        type: string
      ci_reason:
        description: 'Internal: original ci.yml orchestrator reason.'
        required: false
        default: 'manual'
        type: string
      ci_Docker_push:
        description: 'Internal: production image push flag carried by ci.yml.'
        required: false
        default: false
        type: boolean
      ci_Dev_Docker_push:
        description: 'Internal: dev image push flag carried by ci.yml.'
        required: false
        default: false
        type: boolean
      ci_Firmware_Docker_push:
        description: 'Internal: firmware artifact push flag carried by ci.yml.'
        required: false
        default: false
        type: boolean
      ci_Installer_Docker_push:
        description: 'Internal: installer artifact push flag carried by ci.yml.'
        required: false
        default: false
        type: boolean
      ci_vm_image:
        description: 'Internal: VM image ref carried by ci.yml.'
        required: false
        default: 'docker.io/0mniteck/yubios:dev'
        type: string

permissions:
  contents: read
  actions: write

jobs:
  # ── Arch-neutral lint (run once on amd64; linting shell/Dockerfile text is
  #    architecture-independent, so matrixing would just burn a second runner). ──
  shellcheck:
    runs-on: ubuntu-24.04
    container:
      credentials:
        username: 0mniteck42
        password: ${{ secrets.DOCKER }}
      image: docker://dhi.io/debian-base@sha256:5c45913e72c90581fc4cca57c3a7cd7dcac2d9fa44fce24fe4cfa342e5ccb7a6 # trixie-debian13-dev INDEX (manifest list)
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: shellcheck
        run: |
          apt-get update -qq
          apt-get install -y -qq shellcheck
          find usr/lib/yubiOS -name '*.sh' | xargs shellcheck --source-path=usr/lib/yubiOS

  hadolint:
    runs-on: ubuntu-24.04
    container:
      image: docker://ghcr.io/hadolint/hadolint:v2.14.0-debian@sha256:158cd0184dcaa18bd8ec20b61f4c1cabdf8b32a592d062f57bdcb8e4c1d312e2
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: hadolint (Containerfile lint)
        run: hadolint --ignore DL3041 --ignore DL3059 - < Containerfile

  # ── Arch-relevant: native matrix split. runs-on is set from the matrix. ──
  unit-tests:
    needs: [shellcheck, hadolint]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container:
      credentials:
        username: 0mniteck42
        password: ${{ secrets.DOCKER }}
      image: docker://dhi.io/debian-base@sha256:5c45913e72c90581fc4cca57c3a7cd7dcac2d9fa44fce24fe4cfa342e5ccb7a6 # auto-resolves to ${{ matrix.arch }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install test dependencies
        run: |
          apt-get update -qq
          apt-get install -y -qq bats python3 util-linux
      - name: Run unit tests (${{ matrix.arch }})
        run: bats tests/unit/

  mkosi:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container:
      credentials:
        username: 0mniteck42
        password: ${{ secrets.DOCKER }}
      image: docker://dhi.io/debian-base@sha256:5c45913e72c90581fc4cca57c3a7cd7dcac2d9fa44fce24fe4cfa342e5ccb7a6 # auto-resolves to ${{ matrix.arch }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install mkosi (from yubi-OS fork)
        run: |
          apt-get update -qq
          apt-get install -y -qq python3 python3-pip python3-pexpect git
          pip install --break-system-packages git+https://github.com/yubi-OS/mkosi.git@feature/yubiOS-profile
      - name: Validate mkosi config (${{ matrix.arch }})
        run: mkosi summary

  build:
    needs: [shellcheck, hadolint]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            docker_arch: x86_64
            buildx_arch: linux-amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            docker_arch: aarch64
            buildx_arch: linux-arm64
    runs-on: ${{ matrix.runner }}
    container:
      options: --privileged
      volumes:
        - /mnt:/mnt
      credentials:
        username: 0mniteck42
        password: ${{ secrets.DOCKER }}
      image: docker://dhi.io/debian-base@sha256:5c45913e72c90581fc4cca57c3a7cd7dcac2d9fa44fce24fe4cfa342e5ccb7a6 # auto-resolves to ${{ matrix.arch }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install docker-engine and docker-buildx (${{ matrix.arch }})
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git curl iptables nftables
          wcurl "https://download.docker.com/linux/static/stable/${{ matrix.docker_arch }}/docker-29.6.0.tgz"
          wcurl "https://github.com/docker/buildx/releases/download/v0.35.0/buildx-v0.35.0.${{ matrix.buildx_arch }}"
          tar xzf docker-29.6.0.tgz
          mkdir -p /usr/libexec/docker/cli-plugins/
          cp docker/* /usr/bin/
          cp "buildx-v0.35.0.${{ matrix.buildx_arch }}" /usr/libexec/docker/cli-plugins/docker-buildx
          chmod +x /usr/libexec/docker/cli-plugins/docker-buildx
          mkdir -p /mnt/docker
          dockerd --storage-driver=overlayfs --data-root=/mnt/docker -H unix:///var/run/ducker.sock &
          for i in $(seq 1 30); do docker -H unix:///var/run/ducker.sock info >/dev/null 2>&1 && break; sleep 1; done
          docker -H unix:///var/run/ducker.sock buildx create --name hardened \
            --driver docker-container \
            --use

      - name: Log in to Docker Hub
        if: github.event_name == 'workflow_dispatch' && inputs.Docker_push == true
        run: echo "${{ secrets.DOCKER }}" | docker -H unix:///var/run/ducker.sock login -u 0mniteck42 --password-stdin

      - name: Build OCI image (${{ matrix.arch }})
        env:
          ARCH: ${{ matrix.arch }}
          PLATFORM: linux/${{ matrix.arch }}
          GIT_SHA: ${{ github.sha }}
          PUSH: 'false'
        run: |
          docker -H unix:///var/run/ducker.sock info
          docker -H unix:///var/run/ducker.sock buildx bake \
            --builder hardened \
            --file yubiOS-bake.hcl \
            yubios-ci

      # Push each arch by a per-arch tag (no cross-job artifact needed — the merge
      # job combines these tags into one manifest list).
      - name: Push per-arch image (${{ matrix.arch }})
        if: github.event_name == 'workflow_dispatch' && inputs.Docker_push == true
        env:
          ARCH: ${{ matrix.arch }}
          PLATFORM: linux/${{ matrix.arch }}
          GIT_SHA: ${{ github.sha }}
          PUSH: 'true'
        run: |
          docker -H unix:///var/run/ducker.sock buildx bake \
            --builder hardened \
            --file yubiOS-bake.hcl \
            yubios

  # ── Combine the per-arch images into a single multi-arch manifest list.
  #    Uses the docker CLI (no new actions); only on a pushed dispatch. ──
  merge-manifest:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.Docker_push == true
    runs-on: ubuntu-24.04
    container:
      options: --privileged
      volumes:
        - /mnt:/mnt
      credentials:
        username: 0mniteck42
        password: ${{ secrets.DOCKER }}
      image: docker://dhi.io/debian-base@sha256:5c45913e72c90581fc4cca57c3a7cd7dcac2d9fa44fce24fe4cfa342e5ccb7a6
    steps:
      - name: Install docker CLI + buildx
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git curl iptables nftables
          wcurl "https://download.docker.com/linux/static/stable/x86_64/docker-29.6.0.tgz"
          wcurl "https://github.com/docker/buildx/releases/download/v0.35.0/buildx-v0.35.0.linux-amd64"
          tar xzf docker-29.6.0.tgz
          mkdir -p /usr/libexec/docker/cli-plugins/
          cp docker/* /usr/bin/
          cp buildx-v0.35.0.linux-amd64 /usr/libexec/docker/cli-plugins/docker-buildx
          chmod +x /usr/libexec/docker/cli-plugins/docker-buildx
          mkdir -p /mnt/docker
          dockerd --storage-driver=overlayfs --data-root=/mnt/docker -H unix:///var/run/ducker.sock &
          for i in $(seq 1 30); do docker -H unix:///var/run/ducker.sock info >/dev/null 2>&1 && break; sleep 1; done
          docker -H unix:///var/run/ducker.sock buildx create --name hardened \
            --driver docker-container \
            --use

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER }}" | docker -H unix:///var/run/ducker.sock login -u 0mniteck42 --password-stdin

      - name: Create + push multi-arch manifest
        run: |
          docker -H unix:///var/run/ducker.sock buildx imagetools create \
            -t "0mniteck/yubios:${{ github.sha }}" \
            -t "0mniteck/yubios:latest" \
            "0mniteck/yubios:${{ github.sha }}-amd64" \
            "0mniteck/yubios:${{ github.sha }}-arm64"

      - name: Verify manifest list
        run: docker -H unix:///var/run/ducker.sock buildx imagetools inspect "0mniteck/yubios:${{ github.sha }}"

  ci-callback:
    name: Callback to ci.yml orchestrator
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.ci_callback == true }}
    needs: [shellcheck, hadolint, unit-tests, mkosi, build, merge-manifest]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    steps:
      - name: Report current state to ci.yml
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WORKFLOW_NAME: ${{ github.workflow }}
          REF: ${{ inputs.ci_chain_ref != '' && inputs.ci_chain_ref || github.ref_name }}
          NEEDS_JSON: ${{ toJSON(needs) }}
          CI_REASON: ${{ inputs.ci_reason }}
          CI_DOCKER_PUSH: ${{ inputs.ci_Docker_push }}
          CI_DEV_DOCKER_PUSH: ${{ inputs.ci_Dev_Docker_push }}
          CI_FIRMWARE_DOCKER_PUSH: ${{ inputs.ci_Firmware_Docker_push }}
          CI_INSTALLER_DOCKER_PUSH: ${{ inputs.ci_Installer_Docker_push }}
          CI_VM_IMAGE: ${{ inputs.ci_vm_image }}
        run: |
          set -euo pipefail
          conclusion=$(jq -r 'if any(to_entries[]; .value.result == "failure" or .value.result == "cancelled") then "failure" else "success" end' <<<"$NEEDS_JSON")
          payload=$(jq -n \
            --arg ref "$REF" \
            --arg state "$WORKFLOW_NAME" \
            --arg completed_conclusion "$conclusion" \
            --arg reason "$CI_REASON" \
            --arg Docker_push "$CI_DOCKER_PUSH" \
            --arg Dev_Docker_push "$CI_DEV_DOCKER_PUSH" \
            --arg Firmware_Docker_push "$CI_FIRMWARE_DOCKER_PUSH" \
            --arg Installer_Docker_push "$CI_INSTALLER_DOCKER_PUSH" \
            --arg vm_image "$CI_VM_IMAGE" \
            '{ref: $ref, inputs: {state: $state, completed_conclusion: $completed_conclusion, reason: $reason, target_ref: $ref, Docker_push: $Docker_push, Dev_Docker_push: $Dev_Docker_push, Firmware_Docker_push: $Firmware_Docker_push, Installer_Docker_push: $Installer_Docker_push, vm_image: $vm_image}}')
          curl -fsS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/actions/workflows/ci.yml/dispatches" \
            -d "$payload"
          echo "Reported ${WORKFLOW_NAME} as ${conclusion} to ci.yml."
