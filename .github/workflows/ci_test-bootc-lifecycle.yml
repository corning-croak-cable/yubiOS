name: ci_test-bootc-lifecycle
on:
  pull_request:
    paths:
      - 'tests/vm/test-bootc-upgrade.sh'
      - 'tests/vm/test-bootc-rollback.sh'
      - 'tests/vm/test-homed-migrate.sh'
      - 'scripts/ci_test-bootc-lifecycle.yml'
  schedule:
    # Weekly Monday 6 AM UTC drift scan
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      from_image:
        description: 'FROM image (current)'
        required: false
        default: 'docker.io/0mniteck/yubios:dev-1576bce1acbe2b1875098e1a37bf6309a23cee75'
      to_image:
        description: 'TO image (target upgrade)'
        required: false
        default: 'docker.io/0mniteck/yubios:dev'
      allow_real_u2f:
        type: boolean
        description: 'Host has a real YubiKey for destructive legs'
        default: false

permissions:
  contents: read

jobs:
  test-upgrade:
    name: bootc upgrade + rollback test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install bcvk + podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman qemu-system-x86 qemu-utils virtiofsd swtpm genisoimage
          # KVM + FUSE setup (same recipe as ci_test-vm.yml): GH runners ship
          # /dev/kvm root:kvm 0660, and /dev/fuse may be absent -- a missing
          # /dev/fuse is the documented cause of virtiofsd's silent rc=2.
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules || true
          sudo udevadm trigger --name-match=kvm || true
          sudo modprobe fuse || true
          [ -e /dev/fuse ] || sudo mknod /dev/fuse c 10 229 || true
          sudo chmod 666 /dev/fuse || true
          ls -la /dev/kvm /dev/fuse || true
          curl -fsSL https://github.com/yubi-OS/bcvk/releases/latest/download/bcvk -o /tmp/bcvk
          sudo install -m 0755 /tmp/bcvk /usr/local/bin/bcvk
      - name: Run test-bootc-upgrade.sh
        env:
          ALLOW_REAL_U2F: ${{ inputs.allow_real_u2f }}
        run: |
          bash tests/vm/test-bootc-upgrade.sh \
            --from-image "${{ inputs.from_image || 'docker.io/0mniteck/yubios:dev-1576bce1acbe2b1875098e1a37bf6309a23cee75' }}" \
            --to-image "${{ inputs.to_image || 'docker.io/0mniteck/yubios:dev' }}" \
            --allow-real-u2f "${{ inputs.allow_real_u2f || false }}"

  test-homed-migrate:
    name: systemd-homed migration test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install bcvk + podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman qemu-system-x86 qemu-utils virtiofsd swtpm genisoimage
          # KVM + FUSE setup (same recipe as ci_test-vm.yml): GH runners ship
          # /dev/kvm root:kvm 0660, and /dev/fuse may be absent -- a missing
          # /dev/fuse is the documented cause of virtiofsd's silent rc=2.
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules || true
          sudo udevadm trigger --name-match=kvm || true
          sudo modprobe fuse || true
          [ -e /dev/fuse ] || sudo mknod /dev/fuse c 10 229 || true
          sudo chmod 666 /dev/fuse || true
          ls -la /dev/kvm /dev/fuse || true
          curl -fsSL https://github.com/yubi-OS/bcvk/releases/latest/download/bcvk -o /tmp/bcvk
          sudo install -m 0755 /tmp/bcvk /usr/local/bin/bcvk
      - name: Run test-homed-migrate.sh
        env:
          ALLOW_REAL_U2F: ${{ inputs.allow_real_u2f }}
        run: |
          bash tests/vm/test-homed-migrate.sh \
            --allow-real-u2f "${{ inputs.allow_real_u2f || false }}"
