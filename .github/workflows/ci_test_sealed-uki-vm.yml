name: TEST - sealed UKI Secure Boot VM e2e

# Companion to ci_test_bootc-filesystem.yml. Proves the Secure Boot VM lane
# that the bootc-to-filesystem workflow explicitly carves out at its lines 6-7.
# Parent issue: OMN-53. Full spec: refs/sealed-uki-vm-test-2026-07-30.md.
#
# Three jobs (per the design doc's evidence requirement):
#   1. build-and-verify-uki -- builds a signed UKI from a yubiOS OCI image via
#      bootc container ukify (bootc 1.16.6+ capability verified by
#      ci_test_bootc-filesystem.yml run #11 at 7eba4856e7), signs via
#      systemd-sbsign (engine:pkcs11 SoftHSM backend per ADR-008), then
#      verifies sbverify + UKI structure + verity roothash
#      (assertions 1-3 of 6).
#   2. boot-secure-vm -- boots the signed UKI in a QEMU OVMF Secure Boot VM
#      on fresh GitHub-hosted runners, asserts systemd-stub SecureBoot=yes
#      via QEMU serial console (assertion 4 of 6).
#   3. negative-tamper-tests -- proves the negative paths:
#      * Negative 1 (tampered UKI byte flip -> sbverify rejection) -- IMPLEMENTED
#      * Negative 2 (tampered composefs hash -> dm-verity rejection) -- TODO
#      * Negative 3 (missing ROTPK -> unsigned UKI rejection) -- TODO
#
# All jobs run inside the digest-pinned dhi.io/debian-base container
# (security architecture per PINNED.md / the approved-container rule).
# The dhi container runs as root, so install steps use apt-get directly
# without sudo -- matches the canonical ci_mkosi-installer.yml pattern.

on:
  workflow_dispatch:
    inputs:
      image:
        description: Pullable yubiOS OCI image ref
        required: true
        default: 'docker.io/0mniteck/yubios:dev'
        type: string
  workflow_call:

permissions:
  contents: read
  actions: write

jobs:
  build-and-verify-uki:
    name: build + sign + verify signed UKI (assertions 1-3 of 6)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      options: --privileged
      volumes:
        - /mnt:/mnt
      credentials:
        username: 0mniteck42
        password: ${{ secrets.DOCKER }}
      image: docker://dhi.io/debian-base@sha256:9415967aa0ed8adea8b5c048994259d1982026dca143d0303c7bbe0e11ed67d3
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 -- see PINNED.md

      - name: Install build dependencies (incl. docker CLI + rootless daemon per ci_mkosi-installer.yml pattern)
        run: |
          set -euo pipefail
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            git curl iproute2 iptables nftables passwd procps util-linux \
            uidmap slirp4netns fuse-overlayfs \
            binutils dosfstools e2fsprogs jq \
            mkosi opensc softhsm2 tpm2-tools \
            docker.io containerd runc
          command -v mkosi \
            softhsm2-util pkcs11-tool docker dockerd \
            >/dev/null
          # Install docker CLI + rootless daemon (SHA-pinned static binaries,
          # amd64 digest; the canonical ci_mkosi-installer.yml pattern).
          DOCKER_TOOLS_DIR="${RUNNER_TEMP}/docker-tools"
          mkdir -p "$DOCKER_TOOLS_DIR/bin"
          wcurl() {
            local url="$1" sha="$2"
            local file; file="$(basename "$url")"
            curl -fsSL -o "$file" "$url"
            printf '%s  %s\n' "$sha" "$file" | sha512sum --check --strict
          }
          DOCKER_SHA512=42401384ef853dab0a1986a7990420e77d3ee2bc39e178f8817d27ba6c4403998b7aacf3c28c7172135cdeec281cd328a8f2af949b5f57db44a211a093cfd20b
          ROOTLESS_SHA512=184b583a0f325bef12feaf1ca175ff5ea4a65a168f2136eb1daf9c2ae646eecf02134ed65766c8800bd8eb03ac4d338d1e5d700248bc33632027b5b0b52de48a
          wcurl "https://download.docker.com/linux/static/stable/x86_64/docker-29.6.0.tgz" "$DOCKER_SHA512"
          wcurl "https://download.docker.com/linux/static/stable/x86_64/docker-rootless-extras-29.6.0.tgz" "$ROOTLESS_SHA512"
          tar xzf docker-29.6.0.tgz
          tar xzf docker-rootless-extras-29.6.0.tgz
          install -m 0755 docker/* "$DOCKER_TOOLS_DIR/bin/"
          install -m 0755 docker-rootless-extras/dockerd-rootless.sh "$DOCKER_TOOLS_DIR/bin/"
          install -m 0755 docker-rootless-extras/rootlesskit "$DOCKER_TOOLS_DIR/bin/"
          echo "$DOCKER_TOOLS_DIR/bin" >> "$GITHUB_PATH"
          export PATH="$DOCKER_TOOLS_DIR/bin:$PATH"
          # DOCKER_HOST is intentionally NOT exported to GITHUB_ENV.
          # Earlier revisions (V8/V9) set DOCKER_HOST=unix:///run/docker-rootless/docker.sock
          # (rootless socket path that no longer exists). That stale value caused docker
          # CLI in steps 5/7 to fail with "Cannot connect" -- V14 tried `unset DOCKER_HOST`
          # in the preamble but the unset did not take effect (likely GitHub Actions
          # re-injects GITHUB_ENV values into the shell environment). V15 just removes
          # the echo entirely so DOCKER_HOST is never set in the first place -- docker CLI
          # defaults to /var/run/docker.sock where the V12 system dockerd listens.
          echo "DOCKER_CONFIG=$DOCKER_TOOLS_DIR/config" >> "$GITHUB_ENV"
          mkdir -p "$DOCKER_TOOLS_DIR/config/cli-plugins"
          echo "DOCKER_TOOLS_DIR=$DOCKER_TOOLS_DIR" >> "$GITHUB_ENV"

      - name: Resolve image digest
        env:
          DOCKER_PASSWORD: ${{ secrets.DOCKER }}
          REQUESTED_IMAGE: ${{ inputs.image || 'docker.io/0mniteck/yubios:dev' }}
        run: |
          set -euo pipefail
          # V12: use apt-installed system dockerd (from docker.io package).
          # Default socket /var/run/docker.sock. The system docker CLI
          # reliably connects to it without needing -H flags, and is
          # known to properly handle DOCKER_HOST env var precedence.
          #   --storage-driver=vfs   works without kernel overlayfs
          #   --iptables=false       we don't need iptables rules in CI
          #   --ip6tables=false      same
          mkdir -p /var/lib/docker
          nohup dockerd \
            --data-root=/var/lib/docker \
            --exec-root=/var/run/docker \
            --pidfile=/var/run/docker.pid \
            --host=unix:///var/run/docker.sock \
            --iptables=false \
            --ip6tables=false \
            --storage-driver=vfs \
            > "${RUNNER_TEMP}/dockerd.log" 2>&1 < /dev/null &
          disown || true
          DOCKER_PID=$!
          for i in $(seq 1 60); do
            docker info >/dev/null 2>&1 && break
            if ! kill -0 "$DOCKER_PID" 2>/dev/null; then
              cat "${RUNNER_TEMP}/dockerd.log"
              exit 1
            fi
            sleep 1
          done
          if ! docker info >/dev/null 2>&1; then
            cat "${RUNNER_TEMP}/dockerd.log"
            exit 1
          fi
          if [ -n "${DOCKER_PASSWORD:-}" ]; then
            printf '%s' "$DOCKER_PASSWORD" | docker login \
              --username 0mniteck42 --password-stdin docker.io
          fi
          docker pull "$REQUESTED_IMAGE"
          RESOLVED_IMAGE="$(docker image inspect "$REQUESTED_IMAGE" \
            --format '{{ index .RepoDigests 0 }}')"
          test -n "$RESOLVED_IMAGE"
          case "$RESOLVED_IMAGE" in
            *@sha256:*) ;;
            *) echo "::error::image did not resolve to an immutable digest: $RESOLVED_IMAGE"; exit 1 ;;
          esac
          echo "RESOLVED_IMAGE=$RESOLVED_IMAGE" >> "$GITHUB_ENV"

      - name: Bootstrap SoftHSM slot emulating PIV 9c
        run: |
          set -euo pipefail
          # Set explicit token store + conf (per ci_mkosi-installer.yml pattern).
          # On Debian trixie (dhi container), libsofthsm2.so lives at
          # /usr/lib/softhsm/libsofthsm2.so, NOT /usr/lib64/libsofthsm2.so
          # (which is the Fedora/RHEL path).
          export SOFTHSM2_CONF=/tmp/softhsm2.conf
          mkdir -p /var/lib/softhsm/tokens
          printf 'directories.tokendir = /var/lib/softhsm/tokens\nobjectstore.backend = file\n' \
            > "$SOFTHSM2_CONF"
          softhsm2-util --init-token --slot 0 --label yubiOS-ci \
            --pin 1234 --so-pin 1234
          pkcs11-tool --module /usr/lib/softhsm/libsofthsm2.so \
            --login --pin 1234 \
            --keypairgen --key-type EC:prime256v1 \
            --label sb-key --usage-sign
          mkdir -p mkosi.output/pki
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 \
            -keyout mkosi.output/pki/sb.key -out mkosi.output/pki/sb.crt \
            -days 30 -nodes \
            -subj "/CN=yubiOS CI Secure Boot/" \
            -addext "keyUsage=digitalSignature" \
            -addext "extendedKeyUsage=codeSigning"
          pkcs11-tool --module /usr/lib/softhsm/libsofthsm2.so \
            --login --pin 1234 \
            --write-object mkosi.output/pki/sb.crt \
            --type cert --label sb-cert

      - name: Build signed UKI from image (bootc container ukify + systemd-sbsign)
        run: |
          set -euo pipefail
          # V12: use apt-installed system dockerd (from docker.io package).
          # Default socket /var/run/docker.sock. The system docker CLI
          # reliably connects to it without needing -H flags, and is
          # known to properly handle DOCKER_HOST env var precedence.
          #   --storage-driver=vfs   works without kernel overlayfs
          #   --iptables=false       we don't need iptables rules in CI
          #   --ip6tables=false      same
          mkdir -p /var/lib/docker
          nohup dockerd \
            --data-root=/var/lib/docker \
            --exec-root=/var/run/docker \
            --pidfile=/var/run/docker.pid \
            --host=unix:///var/run/docker.sock \
            --iptables=false \
            --ip6tables=false \
            --storage-driver=vfs \
            > "${RUNNER_TEMP}/dockerd.log" 2>&1 < /dev/null &
          disown || true
          DOCKER_PID=$!
          for i in $(seq 1 60); do
            docker info >/dev/null 2>&1 && break
            if ! kill -0 "$DOCKER_PID" 2>/dev/null; then
              cat "${RUNNER_TEMP}/dockerd.log"
              exit 1
            fi
            sleep 1
          done
          if ! docker info >/dev/null 2>&1; then
            cat "${RUNNER_TEMP}/dockerd.log"
            exit 1
          fi
          # V17+V18: install systemd-ukify inside the container first, then bind-mount
          # / to /target so `bootc container ukify` can compute the composefs digest
          # against a non-active target. Without --target (V17 alone), bootc errors:
          #   "Cannot operate on active root filesystem; mount separate target instead"
          # The container is `--privileged` so `mount --bind` works. dnf install is
          # idempotent (|| true so it's a no-op if systemd-ukify is already present).
          docker run --rm --privileged --pid=host --ipc=host \
            --security-opt label=type:unconfined_t \
            -v /var/lib/containers:/var/lib/containers \
            -v /var/lib/softhsm:/var/lib/softhsm:ro \
            -v "$PWD/mkosi.output:/output" \
            -v /dev:/dev \
            "$RESOLVED_IMAGE" \
            bash -c '
              set -euo pipefail
              # V23: systemd-sbsign is part of systemd on the Fedora bootc IMAGE,
              # but not on the Ubuntu CI runner (V21 confirmed). Run sign inside
              # the container. Mount the host's softhsm token dir so the PKCS#11
              # engine inside the container can reach the token. dnf install
              # pulls systemd-sbsign + opensc (engine) + softhsm (libsofthsm2.so).
              dnf install -y systemd-ukify systemd-sbsign opensc softhsm || true
              mkdir -p /target
              mount --bind / /target
              bootc container ukify --rootfs /target -- --output /output/yubios.unsigned.efi
              export SOFTHSM2_CONF=/tmp/softhsm2.conf
              printf "directories.tokendir = /var/lib/softhsm/tokens\nobjectstore.backend = file\n" > "$SOFTHSM2_CONF"
              # systemd-sbsign cannot sign in-place (per the migration), so write
              # to a temp and mv over the target.
              systemd-sbsign sign \
                --private-key=pkcs11:token=yubiOS-ci;object=sb-key;type=private \
                --private-key-source=engine:pkcs11 \
                --certificate=/output/pki/sb.crt \
                --output=/output/yubios.efi.tmp \
                /output/yubios.unsigned.efi
              mv /output/yubios.efi.tmp /output/yubios.efi
            '

      - name: Assert signed UKI is well-formed (assertions 1-3 of 6)
        run: |
          set -euo pipefail
          echo "=== Assertion 1: sbverify accepts signed UKI ==="
          sbverify --cert mkosi.output/pki/sb.crt mkosi.output/yubios.efi
          echo "=== Assertion 2: UKI structure has .cmdline + .linux + .initrd ==="
          systemd-ukify inspect mkosi.output/yubios.efi > /tmp/inspect.txt
          grep -F '.cmdline' /tmp/inspect.txt
          grep -F '.linux' /tmp/inspect.txt
          grep -F '.initrd' /tmp/inspect.txt
          echo "=== Assertion 3: verity roothash embedded in UKI .cmdline ==="
          systemd-ukify inspect mkosi.output/yubios.efi \
            | jq -r '.[".cmdline"]' > /tmp/cmdline.txt
          grep -E '\broothash=[0-9a-f]{64}\b' /tmp/cmdline.txt \
            || { echo "::error::no roothash= in UKI .cmdline"; exit 1; }
          echo "Assertions 1-3 PASS"

      - name: Upload signed UKI artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v4
        with:
          name: sealed-uki-artifacts
          path: |
            mkosi.output/yubios.efi
            mkosi.output/yubios.unsigned.efi
            mkosi.output/pki/sb.crt
            mkosi.output/pki/sb.key
          retention-days: 7

  boot-secure-vm:
    name: boot signed UKI in OVMF Secure Boot VM (assertion 4 of 6)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [build-and-verify-uki]
    container:
      options: --privileged
      volumes:
        - /mnt:/mnt
      credentials:
        username: 0mniteck42
        password: ${{ secrets.DOCKER }}
      image: docker://dhi.io/debian-base@sha256:9415967aa0ed8adea8b5c048994259d1982026dca143d0303c7bbe0e11ed67d3
    steps:
      - name: Install VM dependencies
        run: |
          set -euo pipefail
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            qemu-system-x86 ovmf swtpm tpm2-tools curl

      - name: Download signed UKI artifact
        uses: actions/download-artifact@fa8eb13b434876587b4c5b13ab27cd1a93ec61e9 # v4
        with:
          name: sealed-uki-artifacts
          path: mkosi.output

      - name: Fetch OVMF firmware
        run: |
          set -euo pipefail
          mkdir -p ovmf
          OVMF_VERSION="edk2-stable202405"
          curl -fsSL -o ovmf/OVMF_CODE.fd \
            "https://github.com/tianocore/edk2/releases/download/$OVMF_VERSION/OVMF_CODE.fd"
          curl -fsSL -o ovmf/OVMF_VARS.fd \
            "https://github.com/tianocore/edk2/releases/download/$OVMF_VERSION/OVMF_VARS.fd"
          cp ovmf/OVMF_VARS.fd ovmf/OVMF_VARS.run.fd

      - name: Boot signed UKI in QEMU OVMF Secure Boot VM
        run: |
          set -euo pipefail
          systemd-ukify inspect mkosi.output/yubios.efi \
            | jq -r '.[".cmdline"]' > /tmp/cmdline.txt
          timeout 60 qemu-system-x86_64 \
            -machine q35,smm=on,accel=kvm \
            -cpu host -smp 4 -m 4G \
            -drive if=pflash,format=raw,readonly=on,file=ovmf/OVMF_CODE.fd \
            -drive if=pflash,format=raw,file=ovmf/OVMF_VARS.run.fd \
            -kernel mkosi.output/yubios.efi \
            -append "$(cat /tmp/cmdline.txt)" \
            -nographic \
            -serial mon:stdio \
            -display none \
            -no-reboot \
            > /tmp/qemu.log 2>&1 || true
          if grep -E -i 'Secure Boot[: ]+(enabled|yes)' /tmp/qemu.log; then
            echo "Assertion 4 PASS: systemd-stub reports Secure Boot enabled"
          else
            echo "::error::Secure Boot not detected in QEMU log"
            tail -50 /tmp/qemu.log
            exit 1
          fi

  negative-tamper-tests:
    name: 3 negative tamper tests (1 implemented; 2 + 3 deferred)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: [boot-secure-vm]
    container:
      options: --privileged
      volumes:
        - /mnt:/mnt
      credentials:
        username: 0mniteck42
        password: ${{ secrets.DOCKER }}
      image: docker://dhi.io/debian-base@sha256:9415967aa0ed8adea8b5c048994259d1982026dca143d0303c7bbe0e11ed67d3
    steps:
      - name: Download signed UKI artifact
        uses: actions/download-artifact@fa8eb13b434876587b4c5b13ab27cd1a93ec61e9 # v4
        with:
          name: sealed-uki-artifacts
          path: mkosi.output

      - name: Negative 1 -- tampered UKI byte flip -> sbverify rejection
        run: |
          set -euo pipefail
          cp mkosi.output/yubios.efi mkosi.output/yubios-tampered.efi
          printf X | dd of=mkosi.output/yubios-tampered.efi \
            bs=1 count=1 conv=notrunc
          if sbverify --cert mkosi.output/pki/sb.crt \
              mkosi.output/yubios-tampered.efi 2>/dev/null; then
            echo "::error::sbverify accepted tampered UKI"
            exit 1
          fi
          echo "Negative 1 PASS: sbverify rejected tampered UKI"

      - name: Negative 2 -- tampered composefs hash -> dm-verity rejection (TODO)
        run: |
          echo "TODO: follow-up PR. Requires bootc install to-filesystem, flip"
          echo "one byte in the BLS composefs=<sha512> entry, boot the image, and"
          echo "assert dm-verity refuses to mount the composefs store. See"
          echo "refs/sealed-uki-vm-test-2026-07-30.md section 'Negative 2'."

      - name: Negative 3 -- missing ROTPK -> unsigned UKI rejection (TODO)
        run: |
          echo "TODO: follow-up PR. Requires OVMF_VARS without yubios cert"
          echo "enrolled, attempt to boot the signed UKI, assert OVMF rejects it"
          echo "as unsigned. See refs/sealed-uki-vm-test-2026-07-30.md section"
          echo "'Negative 3'."
