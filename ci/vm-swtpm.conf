# ci/vm-swtpm.conf — systemd drop-in for bcvk ephemeral CI VMs
#
# Enables systemd-tpm2-swtpm.service so ephemeral VMs have a software TPM 2.0
# (via IBM swtpm) available at /dev/tpm0 during CI runs.
#
# Purpose (ADR-016 §Feature 1):
#   - Exercises TPM2 code paths (PCR measurements, LUKS PCR binding) in CI
#     without requiring physical hardware.
#   - Allows ConditionSecurity=measured-os to pass in yubiOS-enroll.service CI tests.
#   - yubiOS production trust anchor remains YubiKey FIDO2 (ADR-003); swtpm is
#     for test coverage ONLY.
#
# Primary implementation: yubi-OS/bcvk (see cross-repo issue).
# The bcvk VM runner must:
#   1. Install swtpm in the test image (dnf install swtpm swtpm-tools)
#   2. Ensure systemd-tpm2-swtpm.service is enabled before first boot
#   3. Pass --feature tpm2-swtpm to bcvk run (tracked in bcvk cross-repo issue)
#
# Requires: systemd >= 261 (systemd-tpm2-swtpm.service added in v261)
# Source: https://github.com/systemd/systemd/releases/tag/v261

[Unit]
Description=Software TPM 2.0 for bcvk CI VMs (swtpm)
Documentation=https://github.com/yubi-OS/yubiOS/blob/main/ADR.md#adr-016
ConditionVirtualization=qemu
ConditionVirtualization=vm

[Service]
# swtpm is managed by systemd-tpm2-swtpm.service; this drop-in only
# adjusts runtime behaviour for CI ephemeral VMs.
# Reduce timeout: CI VMs should fail fast rather than waiting for hardware.
TimeoutStartSec=10
TimeoutStopSec=5
# Ensure swtpm state is in a predictable tmpfs location for CI.
Environment=SWTPM_STATE_DIR=/run/swtpm
RuntimeDirectory=swtpm
RuntimeDirectoryMode=0700
