# yubiOS surface-arm64 profile — Microsoft Surface (Snapdragon X Elite / X Plus)
# Targets: Surface Pro 11, Surface Laptop 7 (ARM)
# Usage: mkosi --profile surface-arm64 build

[Match]
Profile=surface-arm64
Architecture=arm64

[Content]
Packages=
        linux-firmware
        qcom-firmware
        alsa-firmware
        mesa-vulkan-drivers
        mesa-va-drivers
        power-profiles-daemon
        libwacom

KernelCommandLine=
        tpm_tis_core.interrupts=0
        iommu=pt


