# yubiOS CHIPSEC first-boot firmware validation (ADR-024).
#
# Installs the same pinned CHIPSEC PyPI source release used by the bootc
# Containerfile so the mkosi disk-image path can run yubiOS-chipsec-firstboot.

[Content]
Packages=
        python3-pip

PostInstallationScripts=mkosi.conf.d/chipsec/install-chipsec.sh
