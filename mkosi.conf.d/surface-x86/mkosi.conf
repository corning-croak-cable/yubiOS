# yubiOS surface-x86 profile — Microsoft Surface (Intel/AMD x86-64)
# Targets: Surface Pro 9 (Intel), Surface Laptop 5, Surface Go 3
# Usage: mkosi --profile surface-x86 build

[Match]
Profile=surface-x86
Architecture=x86-64

[Content]
Repositories=linux-surface
Packages=
        kernel-surface
        iptsd
        surface-control
        libwacom
        ipu6-camera-hal
        intel-ipu6-dkms
        linux-firmware
        thermald
        power-profiles-daemon

KernelCommandLine=
        nxcompat=0
        intel_iommu=on iommu=pt


