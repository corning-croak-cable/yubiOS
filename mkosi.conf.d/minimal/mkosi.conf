# yubiOS minimal profile
# Headless, no desktop environment. YubiKey + FIDO2 stack only.
# Usage: mkosi --profile minimal build

[Match]
Profile=minimal

[Content]
Packages=
RemovePackages=
        gdm
        gnome-shell
        gnome-session
        pulseaudio
        pipewire


