# yubiOS desktop profile — GNOME on Wayland
# Usage: mkosi --profile desktop build

[Match]
Profile=desktop

[Content]
Packages=
        gnome-shell
        gnome-session
        gdm
        gnome-control-center
        gnome-terminal
        nautilus
        gnome-keyring
        pipewire
        wireplumber
        seahorse

[Runtime]
RuntimeSize=40G


