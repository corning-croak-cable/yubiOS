# yubiOS TEST profile — hardware-free CI image.
#
# Adds an in-guest software CTAP2 FIDO2 authenticator (passless, /dev/uhid) so the
# LUKS2 FIDO2 + systemd-homed e2e (tests/vm/test-luks-fido2-ci.sh, #33/#20) can run
# under `bcvk ephemeral run --swtpm --swu2f` with NO physical YubiKey.
#
# swu2f Layer 2 (bcvk docs/swu2f.md): bcvk's --swu2f only loads the `uhid` kernel
# module via a modules-load= karg. The CTAP2 hmac-secret authenticator binary must
# live INSIDE the guest image. This profile builds & ships it.
#
# TEST-ONLY. The production trust anchor stays the YubiKey FIDO2 device (ADR-003);
# passless is never present in a production profile.
#
# Usage: mkosi --profile test build

[Match]
Profile=test

[Content]
# Runtime deps for the FIDO2/LUKS2/homed legs (most are already in the base
# mkosi.conf; listed here so the test image is self-contained even if the base
# package set is trimmed). passless itself is built from source in the
# post-installation script below (it is not packaged for Fedora).
Packages=
        cryptsetup
        fido2-tools
        pam-u2f
        pamu2fcfg
        swtpm
        swtpm-tools

# Build & install passless into the image. Path is repo-root relative.
PostInstallationScripts=mkosi.conf.d/test/install-swu2f-authenticator.sh


