<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc">
  <title id="title">Leading project-relevant upstream contributors, 2026-04-22 through 2026-07-21</title>
  <desc id="desc">A bubble map of the fifteen leading human contributors across systemd, mkosi, particleos, composefs, and bootc. Circle area is proportional to non-merge commits.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#17112a"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <style>
      .title { font: 700 32px ui-sans-serif, system-ui, sans-serif; fill: #f8fafc; }
      .subtitle { font: 16px ui-sans-serif, system-ui, sans-serif; fill: #cbd5e1; }
      .panel-title { font: 700 20px ui-sans-serif, system-ui, sans-serif; fill: #f8fafc; }
      .name { font: 600 14px ui-sans-serif, system-ui, sans-serif; fill: #f8fafc; text-anchor: middle; }
      .count { font: 800 18px ui-sans-serif, system-ui, sans-serif; fill: #fff; text-anchor: middle; dominant-baseline: middle; }
      .note { font: 13px ui-sans-serif, system-ui, sans-serif; fill: #94a3b8; }
      .panel { fill: #ffffff; fill-opacity: 0.045; stroke: #ffffff; stroke-opacity: 0.12; }
      .systemd { fill: #8b5cf6; stroke: #c4b5fd; }
      .bootc { fill: #0ea5e9; stroke: #7dd3fc; }
      .mkosi { fill: #f43f5e; stroke: #fda4af; }
      .bubble { stroke-width: 2; filter: url(#shadow); }
    </style>
  </defs>
  <rect width="1500" height="900" rx="24" fill="url(#bg)"/>
  <text x="52" y="54" class="title">Who is moving the upstreams yubiOS depends on?</text>
  <text x="52" y="82" class="subtitle">Human-authored, non-merge commits on default branches · 2026-04-22—2026-07-21 · bubble area ∝ commits</text>

