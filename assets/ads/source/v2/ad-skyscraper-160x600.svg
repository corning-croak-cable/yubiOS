<svg xmlns="http://www.w3.org/2000/svg" width="160" height="600" viewBox="0 0 160 600">
  <defs>
    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#03040d" stop-opacity="0.72"/><stop offset="0.65" stop-color="#04040d" stop-opacity="0.34"/><stop offset="1" stop-opacity="0.04"/></linearGradient>
