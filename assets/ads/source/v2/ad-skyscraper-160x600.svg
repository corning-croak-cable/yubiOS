  <text x="80" y="149" text-anchor="middle" fill="#faf6ff" font-family="Nimbus Sans, DejaVu Sans, sans-serif" font-size="30" font-weight="700" letter-spacing="-1">yubiOS</text>
  <rect x="28" y="163" width="104" height="22" rx="11" fill="#100d1d" fill-opacity="0.92" stroke="#ff1493" stroke-opacity="0.62"/>
  <circle cx="41" cy="174" r="3" fill="#89ff38" filter="url(#glow)"/>
  <text x="50" y="178" fill="#f3ecf7" font-family="Nimbus Mono PS, DejaVu Sans Mono, monospace" font-size="7.8" font-weight="700" letter-spacing="0.8">EXPERIMENTAL</text>
  <rect x="20" y="214" width="4" height="294" rx="2" fill="url(#accent)"/>
  <g font-family="Nimbus Sans, DejaVu Sans, sans-serif" font-weight="700" font-size="34" letter-spacing="-1.3" stroke="#03040c" stroke-opacity="0.50" stroke-width="1.2" paint-order="stroke fill">
