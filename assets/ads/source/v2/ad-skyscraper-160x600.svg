  <text x="80" y="535" text-anchor="middle" fill="#c0b5c5" font-family="Nimbus Mono PS, DejaVu Sans Mono, monospace" font-size="8.2" letter-spacing="0.6">FIDO2-FIRST</text>
  <rect x="18" y="549" width="124" height="31" rx="15.5" fill="#f6eff9"/>
  <text x="80" y="569" text-anchor="middle" fill="#13071a" font-family="Nimbus Sans, DejaVu Sans, sans-serif" font-size="9.5" font-weight="700">yubi-OS/yubiOS →</text>
