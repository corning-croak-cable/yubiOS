<svg xmlns="http://www.w3.org/2000/svg" width="300" height="250" viewBox="0 0 300 250">
  <defs>
    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#03040d" stop-opacity="0.55"/><stop offset="0.72" stop-color="#05040d" stop-opacity="0.12"/><stop offset="1" stop-opacity="0"/></linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="logoClip"><rect x="18" y="17" width="48" height="48" rx="11"/></clipPath>
  </defs>
  <rect width="300" height="250" fill="url(#shade)"/>
  <rect x="14" y="13" width="56" height="56" rx="14" fill="#ff1493" fill-opacity="0.12" stroke="#ff5ab8" stroke-opacity="0.52"/>
  <image href="../../../logo.png" x="18" y="17" width="48" height="48" preserveAspectRatio="xMidYMid slice" clip-path="url(#logoClip)"/>
  <text x="80" y="43" fill="#fbf7ff" font-family="Nimbus Sans, DejaVu Sans, sans-serif" font-size="25" font-weight="700" letter-spacing="-0.8">yubiOS</text>
  <circle cx="83" cy="56" r="2.4" fill="#89ff38" filter="url(#glow)"/>
  <text x="90" y="59" fill="#b6abba" font-family="Nimbus Mono PS, DejaVu Sans Mono, monospace" font-size="7.3" letter-spacing="0.9">EXPERIMENTAL</text>
  <g font-family="Nimbus Sans, DejaVu Sans, sans-serif" font-weight="700" letter-spacing="-1.2" stroke="#03040c" stroke-opacity="0.45" stroke-width="1" paint-order="stroke fill">
    <text x="18" y="113" fill="#fcf8ff" font-size="34">TRUST</text>
    <text x="18" y="150" fill="#fcf8ff" font-size="34">STARTS WITH</text>
    <text x="18" y="189" fill="#ff3ca7" font-size="39">YOUR KEY.</text>
  </g>
  <text x="19" y="211" fill="#d0c6d6" font-family="Nimbus Sans, DejaVu Sans, sans-serif" font-size="9.5">FIDO2-first. Built in public.</text>
  <rect x="18" y="221" width="264" height="20" rx="10" fill="#f6f0fa"/>
  <text x="150" y="235" text-anchor="middle" fill="#120719" font-family="Nimbus Mono PS, DejaVu Sans Mono, monospace" font-size="8.5" font-weight="700" letter-spacing="0.4">github.com/yubi-OS/yubiOS →</text>
