<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#03040d" stop-opacity="0.28"/>
      <stop offset="0.62" stop-color="#05040d" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#05040d" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#ff2ca5"/><stop offset="0.52" stop-color="#8b43ff"/><stop offset="1" stop-color="#8cff3b"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="logoClip"><rect x="72" y="72" width="128" height="128" rx="28"/></clipPath>
  </defs>

  <rect width="1080" height="1080" fill="url(#shade)"/>

  <rect x="64" y="64" width="144" height="144" rx="34" fill="#ff1493" fill-opacity="0.11" stroke="#ff54b4" stroke-opacity="0.62"/>
  <image href="../../../logo.png" x="72" y="72" width="128" height="128" preserveAspectRatio="xMidYMid slice" clip-path="url(#logoClip)"/>
  <text x="232" y="135" fill="#f8f4ff" font-family="Nimbus Sans, DejaVu Sans, sans-serif" font-size="62" font-weight="700" letter-spacing="-2">yubiOS</text>
  <text x="234" y="174" fill="#aaa0ba" font-family="Nimbus Mono PS, DejaVu Sans Mono, monospace" font-size="16" letter-spacing="1.8">FIDO2-FIRST • BUILT IN PUBLIC</text>

  <rect x="72" y="250" width="304" height="42" rx="21" fill="#100d1d" fill-opacity="0.92" stroke="#ff1493" stroke-opacity="0.72"/>
  <circle cx="96" cy="271" r="5" fill="#86ff33" filter="url(#glow)"/>
  <text x="112" y="278" fill="#f6edff" font-family="Nimbus Mono PS, DejaVu Sans Mono, monospace" font-size="16" font-weight="700" letter-spacing="1.5">EXPERIMENTAL • PRE-LAUNCH</text>

  <g font-family="Nimbus Sans, DejaVu Sans, sans-serif" font-weight="700" letter-spacing="-3" stroke="#04040d" stroke-opacity="0.42" stroke-width="3" paint-order="stroke fill">
    <text x="68" y="456" fill="#faf7ff" font-size="96">HOLD THE <tspan fill="#ff35a9">KEY.</tspan></text>
    <text x="68" y="574" fill="#faf7ff" font-size="100">VERIFY THE</text>
    <text x="68" y="704" fill="#faf7ff" font-size="116">TRUST CHAIN.</text>
  </g>
  <rect x="72" y="742" width="118" height="6" rx="3" fill="#ff1493"/>
  <rect x="198" y="742" width="56" height="6" rx="3" fill="#00e5ff"/>
  <rect x="262" y="742" width="32" height="6" rx="3" fill="#86ff33"/>

  <text x="72" y="816" fill="#ddd4e5" font-family="Nimbus Sans, DejaVu Sans, sans-serif" font-size="31">FIDO2-first. Image-based. Built in public.</text>
  <text x="72" y="857" fill="#9b91aa" font-family="Nimbus Mono PS, DejaVu Sans Mono, monospace" font-size="17" letter-spacing="1.1">SIGNING • UNLOCK • SSH • LOCAL AUTH</text>

  <rect x="72" y="920" width="480" height="76" rx="38" fill="#f6effb"/>
  <text x="112" y="969" fill="#100717" font-family="Nimbus Sans, DejaVu Sans, sans-serif" font-size="25" font-weight="700" letter-spacing="0.4">EXPLORE THE OPEN PROJECT →</text>
  <text x="1034" y="974" text-anchor="end" fill="#aaa0b7" font-family="Nimbus Mono PS, DejaVu Sans Mono, monospace" font-size="16">github.com/yubi-OS/yubiOS</text>
</svg>
