<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="628" viewBox="0 0 1200 628">
  <defs>
    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#02030b" stop-opacity="0.62"/>
      <stop offset="0.58" stop-color="#04040d" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#04040d" stop-opacity="0.02"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="logoClip"><rect x="54" y="48" width="64" height="64" rx="14"/></clipPath>
  </defs>

  <rect width="1200" height="628" fill="url(#shade)"/>

  <rect x="50" y="44" width="72" height="72" rx="18" fill="#ff1493" fill-opacity="0.11" stroke="#ff54b4" stroke-opacity="0.55"/>
  <image href="../../../logo.png" x="54" y="48" width="64" height="64" preserveAspectRatio="xMidYMid slice" clip-path="url(#logoClip)"/>
  <text x="138" y="82" fill="#faf6ff" font-family="Nimbus Sans, DejaVu Sans, sans-serif" font-size="44" font-weight="700" letter-spacing="-1.3">yubiOS</text>
  <rect x="138" y="94" width="276" height="32" rx="16" fill="#100d1d" fill-opacity="0.90" stroke="#ff1493" stroke-opacity="0.68"/>
  <circle cx="159" cy="110" r="4" fill="#89ff35" filter="url(#glow)"/>
  <text x="173" y="116" fill="#f6effb" font-family="Nimbus Mono PS, DejaVu Sans Mono, monospace" font-size="13" font-weight="700" letter-spacing="1.2">EXPERIMENTAL • PRE-LAUNCH</text>

  <g font-family="Nimbus Sans, DejaVu Sans, sans-serif" font-weight="700" letter-spacing="-2.7" stroke="#03040c" stroke-opacity="0.40" stroke-width="2.5" paint-order="stroke fill">
    <text x="54" y="249" fill="#faf7ff" font-size="72">YOUR MACHINE.</text>
    <text x="54" y="338" fill="#ff39a6" font-size="82">YOUR KEY.</text>
    <text x="54" y="425" fill="#faf7ff" font-size="72">VERIFY THE CHAIN.</text>
  </g>
  <text x="58" y="475" fill="#d3c9db" font-family="Nimbus Sans, DejaVu Sans, sans-serif" font-size="23">FIDO2-first. Image-based. Built in public.</text>
  <rect x="56" y="525" width="329" height="57" rx="28.5" fill="#f8f2fb"/>
  <text x="88" y="562" fill="#100717" font-family="Nimbus Sans, DejaVu Sans, sans-serif" font-size="20" font-weight="700">EXPLORE THE PROJECT →</text>
  <text x="418" y="559" fill="#a59aaf" font-family="Nimbus Mono PS, DejaVu Sans Mono, monospace" font-size="13">github.com/yubi-OS/yubiOS</text>
</svg>
