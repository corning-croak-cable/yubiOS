<svg xmlns="http://www.w3.org/2000/svg" width="970" height="250" viewBox="0 0 970 250">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#030207"/><stop offset="0.7" stop-color="#09040f"/><stop offset="1" stop-color="#14031b"/></linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="white" stop-opacity="0"/><stop offset="0.33" stop-color="white" stop-opacity="0.15"/><stop offset="0.6" stop-color="white"/><stop offset="1" stop-color="white"/></linearGradient>
    <mask id="imageFade"><rect x="0" y="0" width="970" height="250" fill="url(#fade)"/></mask>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="logoClip"><rect x="28" y="22" width="66" height="66" rx="15"/></clipPath>
  </defs>
  <rect width="970" height="250" fill="url(#bg)"/>
  <image href="linux-penguin-foundation.png" x="540" y="0" width="430" height="250" preserveAspectRatio="none" mask="url(#imageFade)"/>
  <rect width="670" height="250" fill="url(#bg)" opacity="0.26"/>
  <path d="M0 118H543" stroke="#8b35ff" stroke-opacity="0.12"/><path d="M0 124H510" stroke="#00e5ff" stroke-opacity="0.08"/>

  <rect x="23" y="17" width="76" height="76" rx="19" fill="#ff1493" fill-opacity="0.12" stroke="#ff53b4" stroke-opacity="0.52"/>
  <image href="../../../logo.png" x="28" y="22" width="66" height="66" preserveAspectRatio="xMidYMid slice" clip-path="url(#logoClip)"/>
  <text x="116" y="60" fill="#fbf7ff" font-family="Nimbus Sans, DejaVu Sans, sans-serif" font-size="36" font-weight="700" letter-spacing="-1.2">yubiOS</text>
  <rect x="116" y="69" width="207" height="24" rx="12" fill="#170b1d" stroke="#ff1493" stroke-opacity="0.58"/>
  <circle cx="130" cy="81" r="3" fill="#89ff38" filter="url(#glow)"/>
  <text x="140" y="85" fill="#f4ecf8" font-family="Nimbus Mono PS, DejaVu Sans Mono, monospace" font-size="9.5" font-weight="700" letter-spacing="1">EXPERIMENTAL • OPEN SOURCE</text>

  <g font-family="Nimbus Sans, DejaVu Sans, sans-serif" font-weight="700" letter-spacing="-1.7">
    <text x="27" y="151" fill="#fbf8ff" font-size="42">LINUX®, MEET</text>
    <text x="27" y="197" fill="#fbf8ff" font-size="42"><tspan fill="#ff3aa5">OWNER-HELD</tspan> TRUST.</text>
  </g>
  <text x="29" y="219" fill="#b6a9bd" font-family="Nimbus Sans, DejaVu Sans, sans-serif" font-size="13">Put the owner back in the trust chain.</text>
  <text x="28" y="240" fill="#776d80" font-family="Nimbus Sans, DejaVu Sans, sans-serif" font-size="8.4">Linux® is the registered trademark of Linus Torvalds in the U.S. and other countries.</text>
  <text x="942" y="240" text-anchor="end" fill="#776d80" font-family="Nimbus Sans, DejaVu Sans, sans-serif" font-size="8.4">Penguin concept: Larry Ewing &amp; The GIMP.</text>
</svg>
