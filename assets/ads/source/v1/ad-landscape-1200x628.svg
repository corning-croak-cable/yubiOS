<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="628" viewBox="0 0 1200 628">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#05030b"/><stop offset="0.57" stop-color="#0d0717"/><stop offset="1" stop-color="#1d0425"/>
    </linearGradient>
    <radialGradient id="orb" cx="78%" cy="50%" r="48%">
      <stop stop-color="#ff1493" stop-opacity="0.26"/><stop offset="0.45" stop-color="#7933ff" stop-opacity="0.12"/><stop offset="1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#b66cff" stroke-opacity="0.075"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="logoClip"><rect x="862" y="154" width="274" height="274" rx="58"/></clipPath>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#ff1493"/><stop offset="0.52" stop-color="#a638ff"/><stop offset="1" stop-color="#7dff31"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="628" fill="url(#bg)"/>
  <rect width="1200" height="628" fill="url(#orb)"/>
  <rect width="1200" height="628" fill="url(#grid)"/>
  <path d="M725 0C702 118 742 199 832 252S990 394 943 628" fill="none" stroke="url(#accent)" stroke-opacity="0.22" stroke-width="20" filter="url(#glow)"/>
  <path d="M785 0C760 110 786 177 874 227S1042 379 1012 628" fill="none" stroke="#00e5ff" stroke-opacity="0.10" stroke-width="2" stroke-dasharray="8 15"/>

  <text x="56" y="76" fill="#faf6ff" font-family="Nimbus Sans, DejaVu Sans, sans-serif" font-size="47" font-weight="700" letter-spacing="-1.4">yubiOS</text>
  <rect x="56" y="102" width="276" height="32" rx="16" fill="#190c21" stroke="#ff1493" stroke-opacity="0.68"/>
  <circle cx="77" cy="118" r="4" fill="#89ff35"/>
  <text x="91" y="124" fill="#f6effb" font-family="Nimbus Mono PS, DejaVu Sans Mono, monospace" font-size="13" font-weight="700" letter-spacing="1.2">EXPERIMENTAL • PRE-LAUNCH</text>

  <g font-family="Nimbus Sans, DejaVu Sans, sans-serif" font-weight="700" letter-spacing="-2.7">
    <text x="54" y="253" fill="#faf7ff" font-size="73">YOUR MACHINE.</text>
    <text x="54" y="339" fill="#ff39a6" font-size="82">YOUR KEY.</text>
    <text x="54" y="425" fill="#faf7ff" font-size="73">YOUR TRUST CHAIN.</text>
  </g>
  <text x="58" y="475" fill="#cfc4d8" font-family="Nimbus Sans, DejaVu Sans, sans-serif" font-size="23">FIDO2-first. Image-based. Built in public.</text>
  <rect x="56" y="525" width="329" height="57" rx="28.5" fill="#f8f2fb"/>
  <text x="88" y="562" fill="#100717" font-family="Nimbus Sans, DejaVu Sans, sans-serif" font-size="20" font-weight="700">EXPLORE THE PROJECT →</text>
  <text x="418" y="559" fill="#8f829d" font-family="Nimbus Mono PS, DejaVu Sans Mono, monospace" font-size="13">github.com/yubi-OS/yubiOS</text>

  <rect x="844" y="136" width="310" height="310" rx="72" fill="#ff1493" fill-opacity="0.09" stroke="url(#accent)" stroke-width="3" filter="url(#glow)"/>
  <rect x="852" y="144" width="294" height="294" rx="66" fill="#07030b" stroke="#ffffff" stroke-opacity="0.14"/>
  <image href="../../../logo.png" x="862" y="154" width="274" height="274" preserveAspectRatio="xMidYMid slice" clip-path="url(#logoClip)"/>
  <circle cx="999" cy="291" r="176" fill="none" stroke="#ff1493" stroke-opacity="0.24" stroke-width="2" stroke-dasharray="6 14"/>
  <circle cx="999" cy="291" r="194" fill="none" stroke="#88ff39" stroke-opacity="0.10"/>
  <text x="1000" y="491" text-anchor="middle" fill="#bcaec7" font-family="Nimbus Mono PS, DejaVu Sans Mono, monospace" font-size="13" letter-spacing="2">OWNER-HELD TRUST</text>
</svg>
