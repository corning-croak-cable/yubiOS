    <text x="18" y="189" fill="#ff3ca7" font-size="39">YOUR KEY.</text>
  </g>
  <text x="19" y="211" fill="#c4b9ce" font-family="Nimbus Sans, DejaVu Sans, sans-serif" font-size="9.5">FIDO2-first. Owner-controlled.</text>
