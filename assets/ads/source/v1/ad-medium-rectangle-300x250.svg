<svg xmlns="http://www.w3.org/2000/svg" width="300" height="250" viewBox="0 0 300 250">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#05030a"/><stop offset="1" stop-color="#18031f"/></linearGradient>
    <radialGradient id="h" cx="87%" cy="34%" r="66%"><stop stop-color="#ff1493" stop-opacity="0.33"/><stop offset="1" stop-opacity="0"/></radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="logoClip"><rect x="18" y="17" width="48" height="48" rx="11"/></clipPath>
  </defs>
  <rect width="300" height="250" fill="url(#bg)"/>
  <rect width="300" height="250" fill="url(#h)"/>
  <g fill="none" opacity="0.30" filter="url(#glow)">
    <rect x="222" y="5" width="52" height="105" rx="26" stroke="#ff1493" stroke-width="7" transform="rotate(31 248 57)"/>
    <rect x="235" y="78" width="52" height="105" rx="26" stroke="#8dff36" stroke-width="7" transform="rotate(-29 261 130)"/>
  </g>
  <rect x="14" y="13" width="56" height="56" rx="14" fill="#ff1493" fill-opacity="0.13" stroke="#ff5ab8" stroke-opacity="0.5"/>
  <image href="../../../logo.png" x="18" y="17" width="48" height="48" preserveAspectRatio="xMidYMid slice" clip-path="url(#logoClip)"/>
  <text x="80" y="43" fill="#fbf7ff" font-family="Nimbus Sans, DejaVu Sans, sans-serif" font-size="25" font-weight="700" letter-spacing="-0.8">yubiOS</text>
  <text x="81" y="59" fill="#9e92aa" font-family="Nimbus Mono PS, DejaVu Sans Mono, monospace" font-size="7.5" letter-spacing="1">EXPERIMENTAL</text>
