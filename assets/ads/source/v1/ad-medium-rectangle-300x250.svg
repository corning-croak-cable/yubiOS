  <text x="150" y="235" text-anchor="middle" fill="#120719" font-family="Nimbus Mono PS, DejaVu Sans Mono, monospace" font-size="8.5" font-weight="700" letter-spacing="0.4">github.com/yubi-OS/yubiOS →</text>
